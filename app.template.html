<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>노가다 현장 합동 비서실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141210'/%3E%3Cpath d='M50 18c-11 0-19 6-22 15h44c-3-9-11-15-22-15z' fill='%23FFC300'/%3E%3Crect x='22' y='36' width='56' height='9' rx='4' fill='%23FFC300'/%3E%3Crect x='42' y='48' width='16' height='26' rx='4' fill='%23FFC300'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#141210; --ink2:#0d0c0a;
  --panel:#1e1b16; --panel2:#262119; --panel3:#302a20;
  --yellow:#ffc300; --yellow2:#ffd84d; --yellow-dim:rgba(255,195,0,.16);
  --text:#f6f0e4; --muted:#a89c86; --muted2:#7d7364;
  --green:#4cc38a; --red:#ff6b5e; --blue:#7cc6fe;
  --r:16px;
  --hazard:repeating-linear-gradient(45deg,#ffc300 0 14px,#141210 14px 28px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
html{height:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  /* 앱 셸: 화면 높이를 꽉 채우고, 스크롤은 main 안에서만 일어난다 */
  display:flex; flex-direction:column;
  height:100vh; height:100dvh; min-height:100vh; min-height:100dvh;
  overflow:hidden;
  background-image:
    radial-gradient(1200px 500px at 80% -10%, rgba(255,195,0,.10), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(255,195,0,.06), transparent 60%);
  background-attachment:fixed;
}
header.hdr{
  position:sticky; top:0; z-index:60; flex:0 0 auto;
  background:linear-gradient(180deg,rgba(30,27,22,.98),rgba(20,18,16,.94));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--yellow-dim);
}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 14px 9px;max-width:960px;margin:0 auto}
.hat{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(180deg,#ffd84d,#f0b400);box-shadow:0 3px 0 #a67f00, inset 0 1px 0 rgba(255,255,255,.5)}
.hdr h1{font-size:15.5px;margin:0;letter-spacing:-.3px;font-weight:800}
.hdr .sub{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted2);display:inline-block;flex:0 0 auto}
.dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(76,195,138,.6);animation:pulse 2s infinite}
.dot.retry{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,195,138,.55)}70%{box-shadow:0 0 0 7px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
.mebtn{margin-left:auto;background:var(--panel2);border:1px solid var(--yellow-dim);color:var(--text);
  border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.mebtn:active{transform:scale(.97)}
.hazard{height:6px;background:var(--hazard);opacity:.95}
main{flex:1 1 auto; min-height:0; width:100%; max-width:960px; margin:0 auto; padding:14px 14px 12px;
  overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  display:flex; flex-direction:column}
.view{display:none; animation:fade .18s ease}
.view.on{display:block; flex:0 0 auto}
/* 무전기 탭은 남는 세로 공간을 끝까지 채운다(입력칸이 탭바 바로 위에 붙는다) */
#view-chat.on{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
@media(max-width:540px){
  main{padding:10px 10px 8px}
  .card{padding:12px}
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 공통 카드 ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--yellow-dim);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.sec-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12.5px;letter-spacing:.4px;color:var(--yellow);text-transform:none;font-weight:800}
.sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--yellow-dim),transparent)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.btn{background:var(--yellow);color:#191600;border:none;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #a67f00}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #a67f00}
.btn.ghost{background:var(--panel3);color:var(--text);box-shadow:none;border:1px solid var(--yellow-dim)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--yellow-dim);color:var(--text);
  border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:active{transform:scale(.97)}

/* ---------- 현장 맵 ---------- */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--yellow-dim);
  box-shadow:0 18px 40px -20px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.03);background:#e9e2d4}
.mapwrap img{display:block;width:100%;height:auto}
.mapwrap:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,18,16,.18),transparent 22%,transparent 78%,rgba(20,18,16,.28))}
.zone{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(20,18,16,.86);backdrop-filter:blur(3px);border:1.5px solid var(--yellow);border-radius:13px;
  padding:6px 9px;color:var(--text);cursor:pointer;font-family:inherit;box-shadow:0 6px 16px -6px rgba(0,0,0,.8);
  transition:transform .15s ease, box-shadow .15s ease;max-width:46vw}
.zone:hover{transform:translate(-50%,-50%) scale(1.04)}
.zone .zn{font-size:11px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.zone .za{font-size:12px;line-height:1}
.zone .zc{position:absolute;top:-7px;right:-7px;background:var(--yellow);color:#191600;border-radius:999px;
  font-size:10px;font-weight:900;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #141210}
.zone.busy{border-color:var(--green)}
.zone.busy .zc{background:var(--green);color:#06210f}
@media(max-width:540px){
  .zone{padding:4px 6px;border-radius:10px}
  .zone .zn{font-size:9.5px;gap:2px}
  .zone .za{font-size:10px}
  .mapwrap img{min-height:230px;object-fit:cover}
}
.mapmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mapmeta .pill{background:var(--panel2);border:1px solid var(--yellow-dim);border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.mapmeta .pill b{color:var(--text)}

/* ---------- 무전기 ---------- */
.chatbox{display:flex;flex-direction:column;gap:9px;min-height:200px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;
  background:var(--panel3);border:1px solid var(--yellow-dim)}
.msg .body{max-width:calc(100% - 60px)}
.msg .who{font-size:11px;color:var(--muted);margin:0 0 3px 2px;display:flex;gap:5px;align-items:center}
.msg .who b{color:var(--text);font-weight:800;font-size:11.5px}
.bubble{background:var(--panel2);border:1px solid rgba(255,255,255,.05);border-radius:14px 14px 14px 4px;
  padding:9px 12px;font-size:14px;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.msg.mine{justify-content:flex-end}
.msg.mine .av{order:2}
.msg.mine .body{order:1;max-width:calc(100% - 60px)}
.msg.mine .who{justify-content:flex-end;margin-right:2px}
.msg.mine .bubble{background:linear-gradient(180deg,var(--yellow2),var(--yellow));color:#191600;border:none;border-radius:14px 14px 4px 14px;font-weight:600}
.msg.sys{justify-content:center}
.msg.sys .bubble{background:transparent;border:1px dashed var(--yellow-dim);color:var(--muted);font-size:12px;border-radius:999px;padding:5px 12px}
/* 무전기 카드: 무전 목록이 남는 높이를 전부 쓰고, 입력줄은 항상 보이게 */
.chatcard{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
.chatcard .quick{flex:0 0 auto}
.chat-scroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 6px; scrollbar-width:thin}
.chatcard .chat-row{flex:0 0 auto}
.mention{color:var(--yellow);font-weight:800}
.msg.mine .mention{color:#5a4300}
.chat-input{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--ink) 30%);padding-top:8px}
.chat-row{display:flex;gap:7px;align-items:flex-end;background:var(--panel2);border:1px solid var(--yellow-dim);border-radius:14px;padding:6px}
.chat-row textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;
  resize:none;outline:none;padding:8px 6px;max-height:110px;line-height:1.4}
.chat-row textarea::placeholder{color:var(--muted2)}
.send{width:42px;height:42px;border-radius:11px;border:none;background:var(--yellow);color:#191600;font-size:18px;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 0 #a67f00}
.send:active{transform:translateY(1px)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

/* ---------- 작업 일지 ---------- */
.tsec{margin:0 0 8px 2px;font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px}
.tsec .cnt{background:var(--panel3);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--text)}
.task{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--yellow-dim);border-left:4px solid var(--muted2);border-radius:13px;padding:12px;margin-bottom:8px}
.task.s-work{border-left-color:var(--yellow)}
.task.s-done{border-left-color:var(--green);opacity:.72}
.task.s-done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:700;font-size:14.5px;line-height:1.35;word-break:break-word}
.task .tm{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.task .acts{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.iconbtn{background:var(--panel3);border:1px solid var(--yellow-dim);color:var(--text);border-radius:9px;
  width:34px;height:30px;display:grid;place-items:center;cursor:pointer;font-size:13px}
.iconbtn:active{transform:scale(.95)}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.addform .line{display:flex;gap:8px}
input[type=text],select{background:var(--panel3);border:1px solid var(--yellow-dim);color:var(--text);border-radius:11px;
  padding:11px 12px;font-size:14px;font-family:inherit;outline:none;width:100%}
input[type=text]:focus,select:focus{border-color:var(--yellow)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

/* ---------- 인력 ---------- */
.crew{display:grid;gap:10px}
@media(min-width:620px){.crew{grid-template-columns:1fr 1fr}}
.agent{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--yellow-dim);border-radius:14px;padding:13px}
.agent .top{display:flex;align-items:center;gap:10px}
.agent .av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--panel3);border:1px solid var(--yellow-dim)}
.agent .nm{font-weight:800;font-size:15px;letter-spacing:-.2px}
.agent .rl{font-size:11.5px;color:var(--muted);margin-top:1px}
.agent .ctl{display:flex;gap:7px;margin-top:11px}
.agent .ctl select{font-size:12.5px;padding:8px 10px;padding-right:26px;border-radius:9px}
.statuspill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
.st-대기중{background:rgba(168,156,134,.18);color:#cfc4ae}
.st-작업중{background:rgba(255,195,0,.18);color:var(--yellow)}
.st-무전대기{background:rgba(124,198,254,.18);color:var(--blue)}
.st-식사중{background:rgba(255,158,122,.18);color:#ff9e7a}
.st-외근{background:rgba(201,167,255,.18);color:#c9a7ff}
.st-합류대기{background:rgba(76,195,138,.16);color:var(--green)}
.st-준비{background:rgba(76,195,138,.16);color:var(--green)}

/* ---------- 제미나이(@제미나이) ---------- */
.msg.ai .av{background:linear-gradient(180deg,#243049,#1a2131);border-color:rgba(124,198,254,.45)}
.msg.ai .bubble{border-color:rgba(124,198,254,.32);background:linear-gradient(180deg,#1d2434,#19202c)}
.msg.typing .bubble{color:var(--muted);border-style:dashed}
.tagai{font-size:9px;font-weight:900;background:var(--blue);color:#06121e;border-radius:999px;padding:1px 5px;letter-spacing:.2px}
.aibanner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(124,198,254,.10);border:1px solid rgba(124,198,254,.38);
  border-radius:12px;padding:9px 11px;font-size:12.5px;color:#cfe7ff;margin:2px 0 10px;line-height:1.45}
.aibanner b{color:#fff}
.aibanner .chip{background:rgba(124,198,254,.16);border-color:rgba(124,198,254,.45);padding:4px 9px;font-size:11.5px;color:#e6f3ff}
.keybox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--ink2);
  border:1px dashed var(--yellow-dim);border-radius:10px;padding:9px 11px;color:#d8cfbc;word-break:break-all}
.aicard .stline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}

/* ---------- 하단 탭 ---------- */
nav.tabs{position:relative; flex:0 0 auto; z-index:70; padding:6px 8px calc(6px + var(--safe-b));
  background:linear-gradient(180deg,rgba(20,18,16,.86),rgba(20,18,16,.99));backdrop-filter:blur(12px);
  border-top:1px solid var(--yellow-dim)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:620px;margin:0 auto}
.tab{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:12px;cursor:pointer;position:relative}
.tab .ic{font-size:19px;line-height:1;filter:grayscale(.55) opacity(.8)}
.tab.on{color:var(--yellow);background:rgba(255,195,0,.09)}
.tab.on .ic{filter:none;transform:translateY(-1px)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:9.5px;font-weight:900;
  border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

/* ---------- 모달 / 시트 ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,7,6,.72);backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.on{display:flex}
.sheet{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--yellow-dim);border-bottom:none;
  border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:16px 16px calc(18px + var(--safe-b));max-height:88vh;max-height:88dvh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:7px}
.sheet .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 5px 3px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel3);border:1px solid var(--yellow-dim);border-radius:13px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--text);width:100%;text-align:left}
.opt:active{transform:scale(.99)}
.opt .em{font-size:20px}
.opt .t{font-weight:800;font-size:14px}
.opt .s{font-size:11.5px;color:var(--muted)}
pre.code{background:var(--ink2);border:1px solid var(--yellow-dim);border-radius:11px;padding:11px;overflow-x:auto;
  font-size:11px;line-height:1.5;color:#d8cfbc;white-space:pre;margin:8px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-14px);top:12px;z-index:200;
  background:var(--yellow);color:#191600;font-weight:800;font-size:13px;padding:9px 15px;border-radius:999px;
  box-shadow:0 10px 28px -10px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
details.help{margin-top:12px;border:1px solid var(--yellow-dim);border-radius:13px;padding:0 12px;background:var(--panel)}
details.help summary{cursor:pointer;padding:12px 0;font-size:13px;font-weight:800;color:var(--yellow);list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{border-bottom:1px solid var(--yellow-dim);margin-bottom:10px}
details.help .body{padding-bottom:12px;color:var(--muted);font-size:12.5px;line-height:1.6}
.empty{text-align:center;color:var(--muted2);font-size:12.5px;padding:18px 8px}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hat">👷</div>
    <div>
      <h1>노가다 현장 합동 비서실</h1>
      <div class="sub"><span class="dot" id="connDot"></span><span id="connTxt">무전망 연결중…</span></div>
    </div>
    <button class="mebtn" id="meBtn"><span id="meEmoji">🧑‍✈️</span><span id="meName">사장님</span></button>
  </div>
  <div class="hazard"></div>
</header>

<main>
  <section class="view on" id="view-map"></section>
  <section class="view" id="view-chat"></section>
  <section class="view" id="view-tasks"></section>
  <section class="view" id="view-crew"></section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab on" data-tab="map"><span class="ic">🗺️</span>현장 맵</button>
    <button class="tab" data-tab="chat"><span class="ic">💬</span>무전기<span class="badge" id="chatBadge" style="display:none">0</span></button>
    <button class="tab" data-tab="tasks"><span class="ic">📋</span>작업 일지</button>
    <button class="tab" data-tab="crew"><span class="ic">👷</span>인력 현황</button>
  </div>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   노가다 현장 합동 비서실
   - 저장/실시간: Firebase RTDB (CFG.rtdbUrl) 또는 임시 ntfy 중계
   ========================================================= */
const QS = new URLSearchParams(location.search);
const DEFAULT_DB = 'https://pickle-nogada-office-default-rtdb.asia-southeast1.firebasedatabase.app';
const CFG = {
  // ?room=이름 으로 또 다른 현장을 만들 수 있습니다.
  room: (QS.get('room') || 'nogada01').replace(/[^A-Za-z0-9_-]/g, ''),

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), n = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString() === n.toDateString()) return hm;
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
}
function ago(ts){
  if(!ts) return '기록 없음';
  const s = Math.floor((now()-ts)/1000);
  if(s < 60) return '방금';
  if(s < 3600) return Math.floor(s/60)+'분 전';
  if(s < 86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
}
function mentionize(text){

/* ---------- 상태 반영 ---------- */
function applyRemoteAgent(id, a){
  if(!a) return;
  a.id = id;
  const c = S.agents[id];
  if(!c || (a.updatedAt||0) >= (c.updatedAt||0)) S.agents[id] = a;
}
function applyRemoteTask(id, t){
  if(!t) return;
  t.id = id;
  const c = S.tasks[id];
  if(!c || (t.updatedAt||0) >= (c.updatedAt||0)) S.tasks[t.id] = t;
}
function applyRemoteMsg(m){
  if(!m || !m.id || S.messages[m.id]) return;
  S.messages[m.id] = m;
  if(m.ts > S.lastSeen && (S.me ? m.from !== S.me.id : true)){
    if(S.tab !== 'chat'){
      S.unread++;
      if(m.ts > (S._bootAt || 0) && !m.sys) toast('📻 ' + (m.name || '무전') + ': ' + String(m.text || '').slice(0, 24));
    }
  }
}
function replaceAgents(obj){
  if(!obj) return;
  const seen = {};
  for(const k in obj){ if(obj[k]){ applyRemoteAgent(k, obj[k]); seen[k]=1; } }
  for(const k in S.agents){ if(!seen[k]) delete S.agents[k]; }
}
function replaceTasks(obj){
  if(!obj) return;
  const seen = {};
  for(const k in obj){ if(obj[k]){ applyRemoteTask(k, obj[k]); seen[k]=1; } }
  for(const k in S.tasks){ if(!seen[k]) delete S.tasks[k]; }
}
function mergeAgents(obj){ for(const k in obj){ if(obj[k]) applyRemoteAgent(k, obj[k]); } }
function mergeTasks(obj){ for(const k in obj){ if(obj[k]) applyRemoteTask(k, obj[k]); } }
function mergeSnapshot(root){
  if(!root || typeof root !== 'object') return;
  if(root.agents) replaceAgents(root.agents);
  if(root.tasks) replaceTasks(root.tasks);
  if(root.messages) for(const k in root.messages){ const m = root.messages[k]; if(m){ m.id = m.id || k; applyRemoteMsg(m); } }
}

/* ---------- 전송 계층 ---------- */
const Wire = {
  mode: CFG.rtdbUrl ? 'rtdb' : 'ntfy',
  base(){ return CFG.rtdbUrl.replace(/\/+$/,''); },
  url(path){ return this.base() + '/rooms/' + CFG.room + path + '.json'; },

  async start(){
    try{
      await this.pull();
      this.setConn('live');
    }catch(e){ this.setConn('retry'); }
    this.stream();
    setInterval(()=>{ if(S.conn !== 'live'){ this.pull().then(()=>this.setConn('live')).catch(()=>{}); } }, 15000);
  },
  setConn(c){
    S.conn = c;
    const dot = $('#connDot'), txt = $('#connTxt');
    dot.className = 'dot ' + (c === 'live' ? 'live' : c === 'retry' ? 'retry' : '');
    txt.textContent = c === 'live'
      ? (this.mode === 'rtdb' ? '무전망 연결됨 · Firebase' : '무전망 연결됨 · 임시 중계(ntfy)')
      : (c === 'retry' ? '무전망 재접속 중…' : '무전망 연결중…');
  },

  /* RTDB */
  async pull(){
    if(this.mode === 'rtdb'){
      const r = await fetch(this.url('') + '?t=' + now());
      if(!r.ok) throw new Error('rtdb ' + r.status);
      mergeSnapshot(await r.json());
      ensureCoreAgents();
      render(); persistState();
      return;
    }
    /* ntfy 캐시 재생 */
    const r = await fetch('https://ntfy.sh/' + CFG.ntfyTopic + '/json?poll=1&since=all&t=' + now());
    if(!r.ok) throw new Error('ntfy ' + r.status);
    const txt = await r.text();
    txt.split('\n').filter(Boolean).forEach(line => {
      try{ const n = JSON.parse(line); if(n.event === 'message' && n.message) applyEnvelope(JSON.parse(n.message)); }catch(e){}
    });
    render(); persistState();
  },
  stream(){
    if(this.mode === 'rtdb'){
      let t = null;
      try{
        const es = new EventSource(this.url(''));
        const reload = () => { clearTimeout(t); t = setTimeout(()=>{ this.pull().catch(()=>{}); }, 350); };
        es.addEventListener('put', reload);
        es.addEventListener('patch', reload);
        es.addEventListener('open', ()=> this.setConn('live'));
        es.addEventListener('error', ()=> this.setConn('retry'));
        this._es = es;
      }catch(e){}
      return;
    }
    try{
      const es = new EventSource('https://ntfy.sh/' + CFG.ntfyTopic + '/sse?since=all');
      es.onopen = () => this.setConn('live');
      es.onerror = () => this.setConn('retry');
      es.onmessage = ev => {
        try{
          const n = JSON.parse(ev.data);
          if(n.event === 'message' && n.message) applyEnvelope(JSON.parse(n.message));
        }catch(e){}
      };
      this._es = es;
    }catch(e){}
  },

  async push(env){
    if(this.mode === 'rtdb'){
      const d = env.d || {};
      let path, method = 'PUT', body = d;
      if(env.t === 'msg'){ path = '/messages/' + d.id; }
      else if(env.t === 'task'){ path = '/tasks/' + d.id; }
      else if(env.t === 'agent'){ path = '/agents/' + d.id; }
      else if(env.t === 'del-task'){ path = '/tasks/' + d.id; method = 'DELETE'; body = null; }
      else if(env.t === 'del-agent'){ path = '/agents/' + d.id; method = 'DELETE'; body = null; }
      else if(env.t === 'state'){
        /* 전체 상태는 각 노드에 나눠 씁니다 */
        for(const k in (d.agents||{})) await this.push({ t:'agent', d: d.agents[k] });
        for(const k in (d.tasks||{})) await this.push({ t:'task', d: d.tasks[k] });
        return;
      } else return;
      const opt = { method };
      if(body) { opt.body = JSON.stringify(body); opt.headers = { 'Content-Type':'application/json' }; }
      const r = await fetch(this.url(path), opt);
      if(!r.ok) throw new Error('rtdb write ' + r.status);
      return;
    }
    /* ntfy */
    const r = await fetch('https://ntfy.sh/' + CFG.ntfyTopic, { method:'POST', body: JSON.stringify(env) });
    if(!r.ok) throw new Error('ntfy write ' + r.status);
  }
};

function applyEnvelope(env){
  if(!env || !env.t) return;
  const d = env.d || {};
  if(env.t === 'msg') applyRemoteMsg(d);
  else if(env.t === 'task') applyRemoteTask(d.id, d);
  else if(env.t === 'del-task') delete S.tasks[d.id];
  else if(env.t === 'agent') applyRemoteAgent(d.id, d);
  else if(env.t === 'del-agent') delete S.agents[d.id];
  else if(env.t === 'state'){ mergeAgents(d.agents || {}); mergeTasks(d.tasks || {}); }
  else if(env.t === 'hello'){ /* 새 참가자에게 상태 알려주기 */ if(Object.keys(S.agents).length) announceState(); }
  render(); persistState();
}
function announceState(){
  Wire.push({ t:'state', ts: now(), d:{ agents: S.agents, tasks: S.tasks } }).catch(()=>{});
}

/* 제미나이·Cue는 어느 현장(방)에나 상주합니다. 명단에 없으면 다시 투입합니다. */
const CORE_AGENTS = ['gemini', 'cue'];
function ensureCoreAgents(){
  let changed = false;
  CORE_AGENTS.forEach(id => {
    if(S.agents[id]) return;
    const a = Object.assign({}, SEED_AGENTS[id], { updatedAt: now() });
    S.agents[id] = a; changed = true;
    Wire.push({ t:'agent', ts: a.updatedAt, d: a }).catch(()=>{});
  });
  if(changed){ render(); persistState(); }
}

    +     '<textarea id="msgInput" rows="1" placeholder="무전 내용을 입력하세요 (@로엔 으로 호출)" enterkeyhint="send"></textarea>'

function renderTasks(){
  const el = $('#view-tasks');

  ];

    body += '<div class="tsec">' + g.label + ' <span class="cnt">' + list.length + '</span></div>';
    body += list.length ? list.map(t => {
      const owner = S.agents[t.owner];

async function copyText(text, okMsg){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      toast(okMsg); return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ ta.setSelectionRange(0, text.length); }catch(e){}
    const ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ toast(okMsg); return true; }
  }catch(e){}
  openSheet(
    '<h3>📋 복사할 문구</h3>'
    + '<p class="desc">자동 복사가 막혀 있습니다. 아래 문구를 길게 눌러 전체 선택 → 복사한 뒤 Cue에게 붙여넣어 주세요.</p>'
    + '<pre class="code" style="max-height:46vh;overflow:auto;white-space:pre-wrap">' + esc(text) + '</pre>'
    + '<button class="btn" id="cpClose" style="width:100%;margin-top:10px">닫기</button>'
  );
  if($('#cpClose')) $('#cpClose').addEventListener('click', closeSheet);
  return false;
}

function buildGeminiPrompt(msg){
  const list = visibleMessages();
  const i = list.findIndex(m => m.id === msg.id);
  const before = (i >= 0 ? list.slice(0, i) : list).filter(m => !m.sys).slice(-6);
  const line = m => (m.name || '무명') + ': ' + String(m.text || '').replace(/\s+/g, ' ').slice(0, 300);
  const ctx = before.length ? before.map(line).join('\n') : '(아직 없음)';
  return '[최근 무전 기록]\n' + ctx
    + '\n\n[지금 온 무전]\n' + line(msg)
    + '\n\n위 무전에 제미나이로서 답해라. 답변 본문만 써라.';
}

function geminiSleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

/* 모델 하나를 호출합니다. 응답 지연은 AbortController로 끊습니다.
   opts.tools === false 이면 구글 검색 도구를 빼고 호출합니다(도구를 거절하는 모델 대비). */
async function geminiCallModel(model, promptText, key, timeoutMs, opts){
  const useTools = !(opts && opts.tools === false);
  /* 3.x: 샘플링 파라미터·thinkingConfig 없이 maxOutputTokens만. thinking이 기본으로 켜져 있어
     그 토큰까지 같은 한도에서 나가므로 2048로 잡는다(작으면 본문이 빈 채로 끝난다). */
  const gen = model.family === 3
    ? { maxOutputTokens: 2048 }
    : { temperature: 0.85, maxOutputTokens: 1200, topP: 0.95 };
  if(model.thinking) gen.thinkingConfig = { thinkingBudget: 0 }; /* 2.5 계열에만 */
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model.id
    + ':generateContent?key=' + encodeURIComponent(key);

  let timer = null, ctrl = null, timedOut = false;
  if(typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    timer = setTimeout(() => { timedOut = true; try{ ctrl.abort(); }catch(e){} }, timeoutMs);
  }
  try{
    const payload = {
      systemInstruction: { parts: [{ text: GEMINI_PERSONA }] },
      contents: [{ role: 'user', parts: [{ text: promptText }] }],
      generationConfig: gen
    };
    if(useTools) payload.tools = GEMINI_SEARCH_TOOLS; /* 실시간 구글 검색 */
    const opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    };
    if(ctrl) opt.signal = ctrl.signal;
    const r = await fetch(url, opt);
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    return { r, data, timedOut: timedOut };
  }catch(e){
    return { r: null, data: null, timedOut: timedOut || !!(e && e.name === 'AbortError'), netErr: e };
  }finally{
    if(timer) clearTimeout(timer);
  }
}

/* 그라운딩 결과에서 출처 제목 1~2개를 뽑습니다(무전기에는 글자로만 보입니다). */
function geminiSources(data){
  const cand = ((data && data.candidates) || [])[0] || {};
  const gm = cand.groundingMetadata || (data && data.groundingMetadata) || {};
  const chunks = gm.groundingChunks || [];
  const out = [];
  chunks.forEach(ch => {
    const web = (ch && ch.web) || {};
    let label = String(web.title || '').trim();
    if(!label && web.uri){
      try{ label = String(new URL(web.uri).hostname).replace(/^www\./, ''); }catch(e){ label = ''; }
    }
    if(!label) return;
    if(label.length > 26) label = label.slice(0, 26).trim() + '…';
    if(out.indexOf(label) < 0) out.push(label);
  });
  return out.slice(0, 2);
}
/* 답 본문 끝에 출처를 한 줄로 붙입니다(본문에 이미 그 이름이 있으면 생략). */
function withGeminiSources(text, data){
  const src = geminiSources(data);
  if(!src.length) return text;
  if(src.some(s => text.indexOf(s.replace(/…$/, '')) >= 0)) return text;
  return text + '\n\n🔎 출처: ' + src.join(' · ');
}

/* 503·429·404·5xx·응답 지연·빈 응답이면 다음 모델로 넘어가 계속 시도합니다.
   검색 도구(tools)를 400으로 거절하는 모델은 같은 모델을 도구 없이 한 번 더 불러 답을 얻습니다.
   모든 모델이 막혔을 때만 사용자에게 안내합니다. */
async function geminiFetch(promptText, key){
  const started = Date.now();
  const tried = [];
  const pushTried = id => { if(tried.indexOf(id) < 0) tried.push(id); };
  let lastModelErr = '';
  let sawBusy = false, sawQuota = false, sawTimeout = false, sawNetwork = false, sawNotFound = false, sawEmpty = false;

  for(let i = 0; i < GEMINI_MODELS.length; i++){
    const model = GEMINI_MODELS[i];
    if(GEMINI_TOTAL_BUDGET_MS - (Date.now() - started) <= 500) break; /* 전체 예산 소진 */
    let useTools = true;

    for(let pass = 0; pass < 2; pass++){
      const left = GEMINI_TOTAL_BUDGET_MS - (Date.now() - started);
      if(left <= 500) break; /* 전체 예산 소진 — 남은 모델은 건너뛴다 */
      const res = await geminiCallModel(model, promptText, key, Math.min(GEMINI_ATTEMPT_TIMEOUT_MS, left), { tools: useTools });

      if(res.r && res.r.ok && res.data){
        const cand = (res.data.candidates || [])[0];
        const parts = (cand && cand.content && cand.content.parts) || [];
        const out = parts.map(p => (p && p.text) ? p.text : '').join('').trim();
        if(out) return { text: withGeminiSources(out, res.data), model: model.id, tried: tried, sources: geminiSources(res.data) };
        /* 200인데 본문이 없다 = thinking이 maxOutputTokens를 다 쓴 경우(MAX_TOKENS)·안전 차단 등
           → 다음 모델로 넘어간다 */
        const why = (cand && cand.finishReason) || (res.data.promptFeedback && res.data.promptFeedback.blockReason) || '';
        pushTried(model.id);
        sawEmpty = true;
        lastModelErr = '본문 없음' + (why ? '(' + why + ')' : '');
        break;
      }

      if(!res.r){
        /* 망 지연·시간초과·일시적 연결 실패 → 다음 모델로 재시도 */
        pushTried(model.id);
        if(res.timedOut) sawTimeout = true; else sawNetwork = true;
        lastModelErr = res.timedOut ? '응답 지연(timeout)' : 'network: ' + String((res.netErr && res.netErr.message) || res.netErr || '');
        break;
      }

      const status = res.r.status;
      const err = (res.data && res.data.error) || {};
      const msg = String(err.message || err.status || '');
      lastModelErr = msg || ('HTTP ' + status);

      if(status === 400 && /api key not valid|api_key_invalid|invalid api key|api key expired/i.test(msg)){
        throw { kind: 'key', userMessage: '🔑 제미나이 API 키가 거부됐습니다(400). 인력 현황 → 🔑 제미나이 API 키 설정에서 키를 다시 넣어주세요.' };
      }
      if(status === 403){
        throw { kind: 'perm', userMessage: '🚫 이 키로는 호출 권한이 없습니다(403). Google AI Studio에서 키 상태·생성형 언어 API 사용 설정을 확인해 주세요.' };
      }

      /* 검색 도구(tools/google_search)를 모르거나 거절하는 모델 → 같은 모델을 도구 없이 한 번 더 */
      if(status === 400 && useTools && /tool|google[ _]?search|grounding|search[ _]?query|function ?(declaration|calling)/i.test(msg)){
        useTools = false;
        continue;
      }

      /* 404(모델 없음) · 429(한도) · 503(과부하) · 5xx(일시 장애) → 다음 모델로 재시도
         400이어도 thinkingConfig·generationConfig 같은 파라미터를 모르는 모델이면 다음 모델로 넘긴다
         (2.5 → 3.x 자동 라우팅처럼 모델 쪽이 바뀌어도 여기서 살아난다) */
      const retriable = GEMINI_RETRY_STATUS.indexOf(status) >= 0
        || /high demand|overloaded|unavailable|resource[ _]?exhausted|rate limit|try again later|not[ _]?found|not supported|does not exist|unknown model|internal error/i.test(msg)
        || (status === 400 && /thinking|generation_?config|unknown (name|field)|unsupported/i.test(msg));
      if(!retriable){
        throw { kind: 'api', userMessage: '🤖 제미나이 호출이 실패했습니다(' + status + '). ' + msg.slice(0, 120) };
      }
      pushTried(model.id);
      if(status === 503) sawBusy = true;
      if(status === 429) sawQuota = true;
      if(status === 404) sawNotFound = true;
      break;
    }

    if(i < GEMINI_MODELS.length - 1) await geminiSleep(GEMINI_RETRY_DELAY_MS);
  }

  /* 모든 모델 소진 — 원인에 맞게 한 번만 알린다 */
  const detail = ' (시도: ' + (tried.join(' → ') || '-') + ')' + (lastModelErr ? ' · ' + String(lastModelErr).slice(0, 80) : '');
  if(sawBusy){
    throw { kind: 'busy', userMessage: '⏳ 지금 제미나이 모델이 모두 붐빕니다(503 — 일시적 수요 폭주). 1~2분 뒤에 다시 불러주세요.' + detail };
  }
  if(sawQuota){
    throw { kind: 'quota', userMessage: '⏳ 제미나이 호출 한도를 넘었습니다(429). 1분쯤 뒤에 다시 불러주세요.' + detail };
  }
  if(sawTimeout || sawNetwork){
    throw { kind: 'network', userMessage: '📡 제미나이 서버 응답이 늦거나 무전망(인터넷)이 불안정합니다. 잠시 뒤 다시 불러주세요.' + detail };
  }
  if(sawNotFound){
    throw { kind: 'model', userMessage: '🤖 쓸 수 있는 제미나이 모델을 찾지 못했습니다. Gemini API 키에서 사용 가능한 모델을 확인해 주세요.' + detail };
  }
  if(sawEmpty){
    throw { kind: 'empty', userMessage: '🤖 제미나이 답이 비어 있습니다. 질문을 조금 바꿔 다시 불러주세요.' + detail };
  }
  throw { kind: 'api', userMessage: '🤖 제미나이 호출이 실패했습니다. 잠시 뒤 다시 불러주세요.' + detail };
}

function askGemini(msg){
  const key = geminiKey();
  if(!key){
    S.geminiNoKeyHint = true;
    render();
    toast('🔑 제미나이 API 키가 없습니다 — [인력 현황]에서 넣어주세요');
    return Promise.resolve(null);
  }
  if(S.geminiBusy){
    toast('🤖 제미나이가 이전 무전에 답하는 중입니다');
    return Promise.resolve(null);
  }
  S.geminiBusy = true;
  S.geminiNoKeyHint = false;
  const base = S.agents.gemini || Object.assign({}, SEED_AGENTS.gemini);
  upsertAgent(Object.assign({}, base, { status: '작업중', zone: 'work' }));
  render();
  return geminiFetch(buildGeminiPrompt(msg), key)
    .then(res => postAiMessage(res.text, { model: res.model }))
    .catch(err => {
      if(err && err.kind === 'key') S.geminiNoKeyHint = true;
      postAiMessage((err && err.userMessage) || '🤖 제미나이 호출이 살패했습니다.', { error: true });
      return null;
    })
    .then(m => {
      S.geminiBusy = false;
      const back = Object.assign({}, S.agents.gemini || base, { status: '대기중', zone: 'work' });
      upsertAgent(back);
      render();
      return m;
    });
}
function postAiMessage(text, extra){
  const m = Object.assign({ id:'m-' + uid(), from:'gemini', name:'제미나이', emoji:'🤖',
                            text:String(text || ''), ts: now(), via:'gemini', ai:true }, extra || {});
  S.messages[m.id] = m;
  render(); persistState();
  Wire.push({ t:'msg', ts: m.ts, d: m }).catch(()=>{});
  setTimeout(scrollChatBottom, 30);
  return m;
}

  render();
  if(t === 'chat') setTimeout(scrollChatBottom, 40);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
$('#meBtn').addEventListener('click', ()=> openIdentity(false));
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zone]');
  if(z) openZone(z.dataset.zone);
});

/* ---------- 시작 ---------- */
const IMG = 'IMG_SRC_PLACEHOLDER';

(function boot(){
  /* 저장된 상태 복원 */
  const cached = LS.get('state', null);
  if(cached && cached.agents) replaceAgents(cached.agents);
  if(cached && cached.tasks) replaceTasks(cached.tasks);
  const cachedMsgs = LS.get('msgs', null);
  if(cachedMsgs && Array.isArray(cachedMsgs.list)) cachedMsgs.list.forEach(m => { if(m && m.id && !S.messages[m.id]) S.messages[m.id] = m; });
  S.me = LS.get('me', null);
  S.lastSeen = LS.get('lastSeen', 0);
  S._bootAt = now();

  /* 씨앗 데이터 */
  if(Object.keys(S.agents).length === 0){
    const t = now() - 60000;
    for(const k in SEED_AGENTS) S.agents[k] = Object.assign({}, SEED_AGENTS[k], { updatedAt: t });
  }
  if(!S.messages[WELCOME.id]) S.messages[WELCOME.id] = Object.assign({}, WELCOME, { ts: now() - 120000 });
  ensureCoreAgents();

  render();
  if(!S.me) openIdentity(true);

  Wire.start().then(()=>{
    /* 새 참가자 알림 + 상태 공유 */
    if(Object.keys(S.agents).length) announceState();
    Wire.push({ t:'hello', ts: now(), d:{} }).catch(()=>{});
    setTimeout(announceState, 1200);
  });

  /* 다른 탭/기기 상태 최신화 */
  setInterval(()=>{ if(Wire.mode === 'rtdb' && S.conn !== 'live') Wire.pull().catch(()=>{}); }, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Wire.pull().catch(()=>{}); });
  window.addEventListener('beforeunload', writeState);
})();
</script>
