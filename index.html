<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>노가다 현장 합동 비서실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141210'/%3E%3Cpath d='M50 18c-11 0-19 6-22 15h44c-3-9-11-15-22-15z' fill='%23FFC300'/%3E%3Crect x='22' y='36' width='56' height='9' rx='4' fill='%23FFC300'/%3E%3Crect x='42' y='48' width='16' height='26' rx='4' fill='%23FFC300'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#141210; --ink2:#0d0c0a;
  --panel:#1e1b16; --panel2:#262119; --panel3:#302a20;
  --yellow:#ffc300; --yellow2:#ffd84d; --yellow-dim:rgba(255,195,0,.16);
  --text:#f6f0e4; --muted:#a89c86; --muted2:#7d7364;
  --green:#4cc38a; --red:#ff6b5e; --blue:#7cc6fe;
  --r:16px;
  --hazard:repeating-linear-gradient(45deg,#ffc300 0 14px,#141210 14px 28px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
html{height:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  /* 앱 셸: 화면 높이를 꽉 채우고, 스크롤은 main 안에서만 일어난다 */
  display:flex; flex-direction:column;
  height:100vh; height:100dvh; min-height:100vh; min-height:100dvh;
  overflow:hidden;
  background-image:
    radial-gradient(1200px 500px at 80% -10%, rgba(255,195,0,.10), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(255,195,0,.06), transparent 60%);
  background-attachment:fixed;
}
header.hdr{
  position:sticky; top:0; z-index:60; flex:0 0 auto;
  background:linear-gradient(180deg,rgba(30,27,22,.98),rgba(20,18,16,.94));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--yellow-dim);
}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 14px 9px;max-width:960px;margin:0 auto}
.hat{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(180deg,#ffd84d,#f0b400);box-shadow:0 3px 0 #a67f00, inset 0 1px 0 rgba(255,255,255,.5)}
.hdr h1{font-size:15.5px;margin:0;letter-spacing:-.3px;font-weight:800}
.hdr .sub{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted2);display:inline-block;flex:0 0 auto}
.dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(76,195,138,.6);animation:pulse 2s infinite}
.dot.retry{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,195,138,.55)}70%{box-shadow:0 0 0 7px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
.mebtn{margin-left:auto;background:var(--panel2);border:1px solid var(--yellow-dim);color:var(--text);
  border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.mebtn:active{transform:scale(.97)}
.authwho{font-size:10.5px;color:var(--muted2);border-left:1px solid var(--yellow-dim);padding-left:7px;margin-left:2px;
  max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hazard{height:6px;background:var(--hazard);opacity:.95}
main{flex:1 1 auto; min-height:0; width:100%; max-width:960px; margin:0 auto; padding:14px 14px 12px;
  overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  display:flex; flex-direction:column}
.view{display:none; animation:fade .18s ease}
.view.on{display:block; flex:0 0 auto}
/* 무전기 탭은 남는 세로 공간을 끝까지 채운다(입력칸이 탭바 바로 위에 붙는다) */
#view-chat.on{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
@media(max-width:540px){
  main{padding:10px 10px 8px}
  .card{padding:12px}
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 공통 카드 ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--yellow-dim);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.sec-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12.5px;letter-spacing:.4px;color:var(--yellow);text-transform:none;font-weight:800}
.sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--yellow-dim),transparent)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.btn{background:var(--yellow);color:#191600;border:none;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #a67f00}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #a67f00}
.btn.ghost{background:var(--panel3);color:var(--text);box-shadow:none;border:1px solid var(--yellow-dim)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--yellow-dim);color:var(--text);
  border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:active{transform:scale(.97)}

/* ---------- 스마트 오피스 맵 ---------- */
/* 현장 맵 탭: 맵 + 상태판이 남는 세로 공간을 함께 채운다(모바일 하단 빈 공간 없음) */
#view-map.on{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;gap:10px}
.mapwrap{position:relative;flex:0 0 auto;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,195,0,.14);background:#0b0e13;
  box-shadow:0 22px 44px -24px rgba(0,0,0,.95), inset 0 0 0 1px rgba(255,255,255,.03)}
.mapwrap img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.mapwrap:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(7,9,13,.34),transparent 17%,transparent 83%,rgba(7,9,13,.44))}
/* 구역 이름표 */
.zone{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;z-index:40;
  background:rgba(12,15,21,.78);backdrop-filter:blur(5px);border:1px solid rgba(255,195,0,.42);border-radius:11px;
  padding:4px 8px;color:var(--text);cursor:pointer;font-family:inherit;
  transition:transform .15s ease, box-shadow .15s ease, border-color .2s ease;max-width:44vw}
.zone:hover{transform:translate(-50%,-50%) scale(1.05)}
.zone .zn{font-size:10.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:3px}
.zone .za{font-size:12px;line-height:1}
.zone .zc{position:absolute;top:-6px;right:-6px;background:var(--yellow);color:#191600;border-radius:999px;
  font-size:9.5px;font-weight:900;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;border:2px solid #0b0e13}
.zone.busy{border-color:rgba(76,195,138,.75);box-shadow:0 0 0 1px rgba(76,195,138,.22)}
.zone.busy .zc{background:var(--green);color:#06210f}
/* 움직이는 캐릭터 — left/top 이 바뀌면 0.8초에 걸쳐 미끄러지듯 이동 */
.actor-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.actor{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;
  background:none;border:0;padding:0;font-family:inherit;cursor:pointer;z-index:3;pointer-events:auto;
  transition:left .8s cubic-bezier(.22,.8,.3,1), top .8s cubic-bezier(.22,.8,.3,1)}
/* 미니 캐릭터(SVG) — 이모지 원 대신 직접 그린 40~46px 캐릭터 */
.actor .chwrap{position:relative;display:grid;place-items:center;width:40px;height:46px}
.actor .ch{display:block;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.actor .ch .ch-shadow{fill:rgba(0,0,0,.42)}
.actor .ch .ch-bob{transform-box:fill-box;transform-origin:50% 100%;animation:chBreathe 3.6s ease-in-out infinite}
.actor .ch .ch-flip{transform-box:fill-box;transform-origin:50% 50%}
.actor .ch.face-left .ch-flip{transform:scaleX(-1)}
.actor .ch .ch-head{transform-box:fill-box;transform-origin:50% 92%;animation:chTilt 5.6s ease-in-out infinite}
.actor .ch .ch-armL,.actor .ch .ch-armR{transform-box:fill-box;transform-origin:50% 10%}
.actor .ch .ch-armL{animation:chArmIdleL 5.6s ease-in-out infinite}
.actor .ch .ch-armR{animation:chArmIdle 5.6s ease-in-out infinite}
.actor .ch .ch-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:chBlink 4.8s steps(1,end) infinite}
.actor .ch .ch-glow{transform-box:fill-box;transform-origin:50% 50%;animation:chGlow 2.4s ease-in-out infinite}
.actor .nm{font-size:9px;font-weight:800;letter-spacing:-.3px;line-height:1.5;color:#f4ecdc;white-space:nowrap;
  background:rgba(10,13,19,.78);border-radius:6px;padding:0 4px;margin-top:-1px;max-width:68px;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.actor .bd{position:absolute;top:-7px;right:-2px;font-size:10px;line-height:1;z-index:2;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.75))}
.actor.idle .bd{animation:badgeFloat 2.8s ease-in-out infinite}
.actor.working .ch{filter:drop-shadow(0 0 5px rgba(76,195,138,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.actor.working .ch .ch-bob{animation:chWorkBob .66s cubic-bezier(.36,.07,.19,.97) infinite}
.actor.working .ch .ch-head{animation:chWorkTilt .66s ease-in-out infinite}
.actor.working .ch .ch-armL{animation:chArmWork .66s ease-in-out infinite}
.actor.working .ch .ch-armR{animation:chArmWork .66s ease-in-out infinite reverse}
.actor.working .bd{animation:badgeFloat 1.5s ease-in-out infinite}
.actor.eating .bd{animation:badgeFloat 2.4s ease-in-out infinite}
.actor.radio .ch{filter:drop-shadow(0 0 4px rgba(124,198,254,.6)) drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.actor.joining .chwrap:before{content:"";position:absolute;left:50%;bottom:0;width:30px;height:30px;margin-left:-15px;
  border-radius:50%;background:radial-gradient(circle,rgba(76,195,138,.5),rgba(76,195,138,0) 68%);
  animation:chPulse 1.9s ease-out infinite;pointer-events:none}
.actor.joining .ch .ch-armR{animation:chWave .95s ease-in-out infinite}
.actor.joining .ch .ch-bob{animation:chJoinBob 1.6s ease-in-out infinite}
.actor.joining .bd{animation:badgeFloat 2s ease-in-out infinite}
.actor.away .chwrap{opacity:.5;filter:grayscale(.4)}
.actor.sel .chwrap{filter:drop-shadow(0 0 7px rgba(255,195,0,.9))}
/* 라운지를 어슬렁거릴 때 — 1.4초에 걸쳐 걷고, 걷는 동안 통통 튀는 걸음 */
.actor.walking{transition:left 1.4s ease-in-out, top 1.4s ease-in-out}
.actor.walking .ch .ch-bob{animation:chWalk .38s ease-in-out infinite}
.actor.walking .ch .ch-head{animation:chTilt 1.2s ease-in-out infinite}
.actor.walking .ch .ch-armL{animation:chArmWork .38s ease-in-out infinite}
.actor.walking .ch .ch-armR{animation:chArmWork .38s ease-in-out infinite reverse}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.06)}}
@keyframes workBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
@keyframes joinPulse{0%{box-shadow:0 0 0 0 rgba(76,195,138,.5), 0 4px 10px rgba(0,0,0,.6)}
  70%{box-shadow:0 0 0 8px rgba(76,195,138,0), 0 4px 10px rgba(0,0,0,.6)}
  100%{box-shadow:0 0 0 0 rgba(76,195,138,0), 0 4px 10px rgba(0,0,0,.6)}}
@keyframes badgeFloat{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-3px);opacity:1}}
/* 미니 캐릭터 애니메이션 키프레임 */
@keyframes chBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5px) scale(1.015)}}
@keyframes chTilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes chBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes chArmIdleL{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}
@keyframes chArmIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes chWorkBob{0%,100%{transform:translateY(0) rotate(-1deg)}35%{transform:translateY(-4.2px) rotate(-2deg)}70%{transform:translateY(-1.4px) rotate(2deg)}}
@keyframes chWorkTilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes chArmWork{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(18deg)}}
@keyframes chWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-34deg)}55%{transform:rotate(-10deg)}80%{transform:rotate(-30deg)}}
@keyframes chJoinBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes chWalk{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-2.8px) rotate(1.2deg)}}
@keyframes chGlow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes chPulse{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){
  .actor{transition:none!important}
  .actor .ch,.actor .ch *,.actor .bd{animation:none!important}
  .actor.joining .chwrap:before{display:none}
}
@media(max-width:540px){
  #view-map.on{gap:8px}
  .zone{padding:3px 6px;border-radius:9px;gap:2px}
  .zone .zn{font-size:9px}
  .actor .chwrap{width:43px;height:49px}
  .actor .nm{font-size:9.5px;max-width:64px}
}
@media(min-width:760px){
  .actor .chwrap{width:48px;height:55px}
  .actor .nm{font-size:10px;max-width:76px}
}
@media(min-width:760px){
  /* PC: 맵은 최대 640px, 상태판은 줄어들지 않고 페이지가 스크롤(잘린 행 없음) */
  .mapwrap{max-width:640px;margin:0 auto}
  .nowcard{flex:0 0 auto}
  .nowlist{flex:0 0 auto;overflow:visible}
}
.mapmeta{display:flex;flex-wrap:wrap;gap:6px}
.mapmeta .pill{background:var(--panel2);border:1px solid var(--yellow-dim);border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--muted)}
/* 모바일: 요약 4칸을 2×2로 고르게 — 줄바꿈으로 한 칸만 떨어지는 어색함 없이 */
@media(max-width:540px){
  .mapmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mapmeta .pill{text-align:center;padding:6px 8px}
}
/* 지금 오피스(상태판) — 카드가 남는 높이를 채우고 목록 줄이 고르게 늘어난다 */
.nowcard{display:flex;flex-direction:column;flex:1 1 auto;min-height:208px}
.nowlist{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin}
.nowrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(255,195,0,.09);min-height:44px}
.nowrow:last-child{border-bottom:0}
.nowrow .nav{width:34px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel3);
  border:1px solid var(--yellow-dim);font-size:16px;flex:0 0 auto;overflow:hidden}
.nowrow .nav .ch{width:100%;height:100%;display:block}
.nowrow .nname{font-weight:800;font-size:13.5px;letter-spacing:-.2px}
.nowrow .nsub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maphint{font-size:10.5px;color:var(--muted2);text-align:center;padding-top:8px}
@media(max-width:540px){.nowrow{flex:1 1 auto;padding:9px 2px}}
.mapmeta .pill b{color:var(--text)}

/* ---------- 무전기 ---------- */
.chatbox{display:flex;flex-direction:column;gap:9px;min-height:200px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{width:32px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;
  background:var(--panel3);border:1px solid var(--yellow-dim);overflow:hidden}
.msg .av .ch{width:100%;height:100%;display:block}
.chip .ch{width:18px;height:20px;display:block;flex:0 0 auto;margin-right:-1px}
.msg .body{max-width:calc(100% - 60px)}
.msg .who{font-size:11px;color:var(--muted);margin:0 0 3px 2px;display:flex;gap:5px;align-items:center}
.msg .who b{color:var(--text);font-weight:800;font-size:11.5px}
.bubble{background:var(--panel2);border:1px solid rgba(255,255,255,.05);border-radius:14px 14px 14px 4px;
  padding:9px 12px;font-size:14px;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.msg.mine{justify-content:flex-end}
.msg.mine .av{order:2}
.msg.mine .body{order:1;max-width:calc(100% - 60px)}
.msg.mine .who{justify-content:flex-end;margin-right:2px}
.msg.mine .bubble{background:linear-gradient(180deg,var(--yellow2),var(--yellow));color:#191600;border:none;border-radius:14px 14px 4px 14px;font-weight:600}
.msg.sys{justify-content:center}
.msg.sys .bubble{background:transparent;border:1px dashed var(--yellow-dim);color:var(--muted);font-size:12px;border-radius:999px;padding:5px 12px}
/* 무전기 카드: 무전 목록이 남는 높이를 전부 쓰고, 입력줄은 항상 보이게 */
.chatcard{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
.chatcard .quick{flex:0 0 auto}
.chat-scroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 6px; scrollbar-width:thin}
.chatcard .chat-row{flex:0 0 auto}
.mention{color:var(--yellow);font-weight:800}
.msg.mine .mention{color:#5a4300}
.chat-input{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--ink) 30%);padding-top:8px}
.chat-row{display:flex;gap:7px;align-items:flex-end;background:var(--panel2);border:1px solid var(--yellow-dim);border-radius:14px;padding:6px}
.chat-row textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;
  resize:none;outline:none;padding:8px 6px;max-height:110px;line-height:1.4}
.chat-row textarea::placeholder{color:var(--muted2)}
.send{width:42px;height:42px;border-radius:11px;border:none;background:var(--yellow);color:#191600;font-size:18px;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 0 #a67f00}
.send:active{transform:translateY(1px)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

/* ---------- 작업 일지 ---------- */
.tsec{margin:0 0 8px 2px;font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px}
.tsec .cnt{background:var(--panel3);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--text)}
.task{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--yellow-dim);border-left:4px solid var(--muted2);border-radius:13px;padding:12px;margin-bottom:8px}
.task.s-work{border-left-color:var(--yellow)}
.task.s-done{border-left-color:var(--green);opacity:.72}
.task.s-done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:700;font-size:14.5px;line-height:1.35;word-break:break-word}
.task .tm{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.task .acts{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}

function charSvg(a){
  const id = typeof a === 'string' ? a : (a && a.id) || 'generic';

/* ---------- 인력(봇) 이름 ----------
   로엔·박빈나·제미나이·그록은 이름을 바꿔도 부르던 이름(@제미나이·@gemini …)을
   그대로 두고, 새 이름(@새이름)도 함께 알아듣습니다. 이름·직책은 agents/{id}에 저장됩니다. */
const AGENT_ALIASES = {
  roen:   ['로엔', 'roen'],
  binna:  ['박빈나 피클', '박빈나', '빈나', 'binna'],
  gemini: ['제미나이', 'gemini'],
  groq:   ['그록', 'groq']
};
function agentById(id){
  try{ if(S && S.agents && S.agents[id]) return S.agents[id]; }catch(e){}
  return SEED_AGENTS[id] || null;
}
function agentName(id){ const a = agentById(id); return a && a.name ? a.name : id; }
function agentEmoji(id){ const a = agentById(id); return a && a.emoji ? a.emoji : '🙂'; }
function agentAliases(id){
  const out = [];
  const push = v => { const s = String(v == null ? '' : v).trim(); if(s && out.indexOf(s) < 0) out.push(s); };
  const a = S.agents[id];
  if(a){ push(a.name); push(a.origName); }
  (AGENT_ALIASES[id] || []).forEach(push);
  if(!a && SEED_AGENTS[id]) push(SEED_AGENTS[id].name);
  return out.sort((x, y) => y.length - x.length);
}
const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* 무전문에서 @이름 으로 부른 인력을 찾아냅니다(새 이름·예전 이름 모두). */
function mentionedAgentIds(text){
  const t = String(text == null ? '' : text);
  if(t.indexOf('@') < 0) return [];
  const ids = [];
  Object.keys(S.agents).forEach(id => {
    const al = agentAliases(id);
    if(!al.length) return;
    const re = new RegExp('@\\s*(?:' + al.map(reEsc).join('|') + ')'
      + '(?:님|씨|한테|에게|한테는|에게는|는|이|가|을|를|도|만|와|과|랑|이랑|아|야)?'

function shortName(n){

/* 이름·직책 바꾸기 — 새 이름/직책에 편집 시각(nameEditedAt)을 찍어 두어
   다른 기기의 낡은 상태가 저장된 이름을 되돌려 쓰지 않게 합니다. */
function renameAgent(id, name, role){
  const a = S.agents[id];
  if(!a) return null;
  const nn = String(name == null ? '' : name).trim().slice(0, 16);
  if(!nn) return null;
  const rr = String(role == null ? '' : role).trim().slice(0, 24);
  const origName = a.origName || a.name || nn;
  const origRole = a.origRole || a.role || '';
  const t = now();
  const next = Object.assign({}, a, {
    name: nn, role: rr || a.role || '',
    origName: origName, origRole: origRole,
    customName: nn !== origName,
    customRole: rr !== origRole,
    nameEditedAt: t, roleEditedAt: t
  });
  upsertAgent(next);
  syncMyIdentity(id, next);
  return next;
}
/* 기본값 복원 — 처음 이름(로엔·제미나이 …)으로 되돌립니다. */
function resetAgentName(id){
  const a = S.agents[id];
  if(!a) return null;
  const d = SEED_AGENTS[id] || { name: a.origName || a.name, role: a.origRole || a.role };
  const t = now();
  const next = Object.assign({}, a, {
    name: d.name, role: d.role || '',
    customName: false, customRole: false,

  });
  upsertAgent(next);
  syncMyIdentity(id, next);
  return next;
}

   prefers-reduced-motion 이면 아예 움직이지 않습니다. */
const ROAM = { minX: 54, maxX: 88, minY: 56, maxY: 78, walkMs: 1400, minWait: 5200, maxWait: 7400 };
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function ensureRoam(id, x, y){
  if(REDUCED_MOTION) return null;
  let r = S.roam[id];
  if(!r){
    r = S.roam[id] = { x: x, y: y, nextAt: now() + 2600 + Math.random() * 2400, walkingUntil: 0, face: false };
  }
  return r;
}
function roamSpot(id){
  /* 다른 캐릭터와 이름표가 겹치지 않게 — 가로 17%·세로 13% 안에 들어오면 다시 고릅니다. */
  let best = null, bestScore = -1;
  for(let i = 0; i < 14; i++){
    const x = ROAM.minX + Math.random() * (ROAM.maxX - ROAM.minX);
    const y = ROAM.minY + Math.random() * (ROAM.maxY - ROAM.minY);
    let score = 999, clash = false;
    Object.keys(S.roam).forEach(k => {
      if(k === id) return;
      const r = S.roam[k];
      if(!r) return;
      const dx = Math.abs(r.x - x), dy = Math.abs(r.y - y);
      if(dx < 17 && dy < 13) clash = true;
      score = Math.min(score, Math.max(dx / 17, dy / 13));
    });
    if(score > bestScore){ bestScore = score; best = { x: x, y: y }; }
    if(!clash) break;
  }
  return best;
}
/* 0.7초마다 시계만 보고, 걸을 때가 된 캐릭터만 새 자리로 보냅니다(렌더는 바뀔 때만). */
function roamStep(){
  if(REDUCED_MOTION || S.tab !== 'map') return;
  if(document.hidden) return;
  const t = now();
  let changed = false;
  Object.values(S.agents).forEach(a => {
    if(a.status !== '대기중'){
      if(S.roam[a.id]){ delete S.roam[a.id]; changed = true; }
      return;
    }
    const r = S.roam[a.id];
    if(!r) return;
    if(r.walkingUntil && t >= r.walkingUntil){ r.walkingUntil = 0; changed = true; }
    if(t < r.nextAt) return;
    const spot = roamSpot(a.id);
    if(!spot){ r.nextAt = t + 2000; return; }
    r.face = spot.x < r.x;
    r.x = spot.x; r.y = spot.y;
    r.walkingUntil = t + ROAM.walkMs;
    r.nextAt = t + ROAM.minWait + Math.random() * (ROAM.maxWait - ROAM.minWait);
    changed = true;
    /* 걷기(1.4초)가 끝나는 순간 바로 숨쉬기 자세로 — 0.7초 폴링을 기다리지 않게 */
    const rid = a.id;
    setTimeout(() => {
      const rr = S.roam[rid];
      if(rr && rr.walkingUntil && now() >= rr.walkingUntil){ rr.walkingUntil = 0; render(); }
    }, ROAM.walkMs + 40);
  });
  if(changed) render();
}

function fmtTime(ts){

  if(s < 3600) return Math.floor(s/60)+'분 전';
  if(s < 86400) return Math.floor(s/3600)+'시간 전';

  const names = ['사장님', '게스트'];

  clearTimeout(persistT);
  persistT = setTimeout(writeState, 400);
}
function writeState(){
  LS.set('state', { agents:S.agents, tasks:S.tasks, at: now() });
  const msgs = Object.values(S.messages).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-300);
  LS.set('msgs', { list: msgs, at: now() });
}

/* ---------- 바꾼 이름 기억 ----------
   마지막으로 바꾼 이름을 이 기기에 남겨 둡니다. 인력이 잠깐 명단에서 빠졌다가
   씨앗·코어 재투입으로 돌아와도 새 이름 그대로 다시 나타납니다. */
let NAME_MEMO = {};
function loadNameMemo(){ NAME_MEMO = LS.get('names', {}) || {}; }
function rememberName(a){
  if(!a || !a.id) return;
  if(!(a.customName || a.customRole || a.nameEditedAt)) return;
  const cur = NAME_MEMO[a.id];
  if(cur && (cur.nameEditedAt || 0) > (a.nameEditedAt || 0)) return;
  NAME_MEMO[a.id] = { name: a.name, role: a.role, origName: a.origName, origRole: a.origRole,
    customName: !!a.customName, customRole: !!a.customRole,
    nameEditedAt: a.nameEditedAt || 0, roleEditedAt: a.roleEditedAt || 0 };
  LS.set('names', NAME_MEMO);
}
function applyNameMemo(a){
  const m = a && a.id ? NAME_MEMO[a.id] : null;
  if(!m || (m.nameEditedAt || 0) <= (a.nameEditedAt || 0)) return a;
  return Object.assign({}, a, { name: m.name, role: m.role, origName: m.origName, origRole: m.origRole,
    customName: m.customName, customRole: m.customRole,
    nameEditedAt: m.nameEditedAt, roleEditedAt: m.roleEditedAt });
}

/* ---------- 상태 반영 ---------- */
function applyRemoteAgent(id, a){
  if(!a) return;
  if(RETIRED_AGENTS.indexOf(id) >= 0) return;
  a.id = id;
  const c = S.agents[id];
  /* 이름·직책은 편집 시각이 더 최신인 쪽을 남깁니다 — 다른 기기의 낡은 상태(기본 이름)가
     저장된 새 이름을 덮어씁니다. */
  if(c){
    if((c.nameEditedAt || 0) > (a.nameEditedAt || 0)){
      a.name = c.name; a.origName = c.origName;
      a.customName = c.customName; a.nameEditedAt = c.nameEditedAt;
    }
    if((c.roleEditedAt || 0) > (a.roleEditedAt || 0)){
      a.role = c.role; a.origRole = c.origRole;
      a.customRole = c.customRole; a.roleEditedAt = c.roleEditedAt;
    }
  }
  if(!c || (a.updatedAt||0) >= (c.updatedAt||0)){ S.agents[id] = a; rememberName(a); }
}
function applyRemoteTask(id, t){
  if(!t) return;
  t.id = id;
  const c = S.tasks[id];
  if(!c || (t.updatedAt||0) >= (c.updatedAt||0)) S.tasks[t.id] = t;
}
function applyRemoteMsg(m){
  if(!m || !m.id || S.messages[m.id]) return;
  S.messages[m.id] = m;
  if(m.ts > S.lastSeen && (S.me ? m.from !== S.me.id : true)){
    if(S.tab !== 'chat'){
      S.unread++;
      if(m.ts > (S._bootAt || 0) && !m.sys) toast('📻 ' + (m.name || '무전') + ': ' + String(m.text || '').slice(0, 24));
    }
  }
}
function replaceAgents(obj){
  if(!obj) return;
  const seen = {};
  for(const k in obj){ if(obj[k]){ applyRemoteAgent(k, obj[k]); seen[k]=1; } }
  for(const k in S.agents){ if(!seen[k]) delete S.agents[k]; }
}
function replaceTasks(obj){
  if(!obj) return;
  const seen = {};
  for(const k in obj){ if(obj[k]){ applyRemoteTask(k, obj[k]); seen[k]=1; } }
  for(const k in S.tasks){ if(!seen[k]) delete S.tasks[k]; }
}
function mergeAgents(obj){ for(const k in obj){ if(obj[k]) applyRemoteAgent(k, obj[k]); } }
function mergeTasks(obj){ for(const k in obj){ if(obj[k]) applyRemoteTask(k, obj[k]); } }
function mergeSnapshot(root){
  if(!root || typeof root !== 'object') return;
  if(root.agents) replaceAgents(root.agents);
  if(root.tasks) replaceTasks(root.tasks);
  if(root.messages) for(const k in root.messages){ const m = root.messages[k]; if(m){ m.id = m.id || k; applyRemoteMsg(m); } }
}

/* ---------- 전송 계층 ---------- */
const Wire = {
  mode: CFG.rtdbUrl ? 'rtdb' : 'ntfy',
  base(){ return CFG.rtdbUrl.replace(/\/+$/,''); },
  url(path){ return this.base() + '/rooms/' + CFG.room + path + '.json'; },
  /* RTDB REST/SSE 호출에는 로그인 토큰을 ?auth= 로 붙입니다.
     토큰이 없으면(로그인 전) 인증 없이 호출하고, 401을 받으면 로그인 화면을 띄웁니다. */
  query(path, extra){
    const parts = [];
    if(this.mode === 'rtdb' && AUTH.required && AUTH.token) parts.push('auth=' + encodeURIComponent(AUTH.token));
    if(extra) parts.push(extra);
    return this.url(path) + (parts.length ? '?' + parts.join('&') : '');
  },
  /* 토큰은 1시간 유효합니다. 40분이 지나면 미리 새로 받아옵니다. */
  async ensureToken(force){
    if(this.mode !== 'rtdb' || !AUTH.required || !AUTH.user) return AUTH.token || '';
    if(!force && AUTH.token && (now() - AUTH.tokenAt) < 2400000) return AUTH.token;
    try{
      AUTH.token = await AUTH.user.getIdToken(!!force);
      AUTH.tokenAt = now();
    }catch(e){}
    return AUTH.token || '';
  },
  closeStream(){ if(this._es){ try{ this._es.close(); }catch(e){} this._es = null; } },
  restartStream(){ this.closeStream(); this.stream(); },

  async start(){
    try{
      await this.pull();
      this.setConn('live');
    }catch(e){ this.setConn('retry'); }
    this.stream();
    setInterval(()=>{ if(S.conn !== 'live'){ this.pull().then(()=>this.setConn('live')).catch(()=>{}); } }, 15000);
  },
  setConn(c){
    S.conn = c;
    const dot = $('#connDot'), txt = $('#connTxt');
    dot.className = 'dot ' + (c === 'live' ? 'live' : c === 'retry' ? 'retry' : '');
    txt.textContent = c === 'live'
      ? (this.mode === 'rtdb' ? '무전망 연결됨 · Firebase' : '무전망 연결됨 · 임시 중계(ntfy)')
      : (c === 'retry' ? '무전망 재접속 중…' : '무전망 연결중…');
  },

  /* RTDB */
  async pull(){
    if(this.mode === 'rtdb'){
      if(AUTH.denied) throw new Error('rtdb denied');
      if(AUTH.required && !AUTH.user) throw new Error('rtdb login required');
      await this.ensureToken();
      const r = await fetch(this.query('', 't=' + now()));
      if(r.status === 401 || r.status === 403){ authDenied(); throw new Error('rtdb ' + r.status); }
      if(!r.ok) throw new Error('rtdb ' + r.status);
      mergeSnapshot(await r.json());
      S.pulled = true;
      ensureCoreAgents();
      stampSeedAgents();
      render(); persistState();
      return;
    }
    /* ntfy 캐시 재생 */
    const r = await fetch('https://ntfy.sh/' + CFG.ntfyTopic + '/json?poll=1&since=all&t=' + now());
    if(!r.ok) throw new Error('ntfy ' + r.status);
    const txt = await r.text();
    txt.split('\n').filter(Boolean).forEach(line => {
      try{ const n = JSON.parse(line); if(n.event === 'message' && n.message) applyEnvelope(JSON.parse(n.message)); }catch(e){}
    });
    S.pulled = true;
    stampSeedAgents();
    render(); persistState();
  },
  stream(){
    if(this.mode === 'rtdb'){
      if(AUTH.required && !AUTH.token) return;
      this.closeStream();
      let t = null;
      try{
        const es = new EventSource(this.query('', 't=' + now()));
        const reload = () => { clearTimeout(t); t = setTimeout(()=>{ this.pull().catch(()=>{}); }, 350); };
        es.addEventListener('put', reload);
        es.addEventListener('patch', reload);
        es.addEventListener('open', ()=> this.setConn('live'));
        es.addEventListener('error', ()=> this.setConn('retry'));
        this._es = es;
      }catch(e){}
      return;
    }
    try{
      const es = new EventSource('https://ntfy.sh/' + CFG.ntfyTopic + '/sse?since=all');
      es.onopen = () => this.setConn('live');
      es.onerror = () => this.setConn('retry');
      es.onmessage = ev => {
        try{
          const n = JSON.parse(ev.data);
          if(n.event === 'message' && n.message) applyEnvelope(JSON.parse(n.message));
        }catch(e){}
      };
      this._es = es;
    }catch(e){}
  },

  async push(env){
    if(this.mode === 'rtdb'){
      if(AUTH.denied) throw new Error('rtdb denied');
      if(AUTH.required && !AUTH.user) throw new Error('rtdb login required');
      const d = env.d || {};
      let path, method = 'PUT', body = d;
      if(env.t === 'msg'){ path = '/messages/' + d.id; }
      else if(env.t === 'task'){ path = '/tasks/' + d.id; }
      else if(env.t === 'agent'){ path = '/agents/' + d.id; }
      else if(env.t === 'del-task'){ path = '/tasks/' + d.id; method = 'DELETE'; body = null; }
      else if(env.t === 'del-agent'){ path = '/agents/' + d.id; method = 'DELETE'; body = null; }
      else if(env.t === 'state'){
        /* 전체 상태는 각 노드에 나눠 씁니다 */
        for(const k in (d.agents||{})) await this.push({ t:'agent', d: d.agents[k] });
        for(const k in (d.tasks||{})) await this.push({ t:'task', d: d.tasks[k] });
        return;
      } else return;
      const opt = { method };
      if(body) { opt.body = JSON.stringify(body); opt.headers = { 'Content-Type':'application/json' }; }
      await this.ensureToken();
      const r = await fetch(this.query(path), opt);
      if(r.status === 401 || r.status === 403){ authDenied(); throw new Error('rtdb write ' + r.status); }
      if(!r.ok) throw new Error('rtdb write ' + r.status);
      return;
    }
    /* ntfy */
    const r = await fetch('https://ntfy.sh/' + CFG.ntfyTopic, { method:'POST', body: JSON.stringify(env) });
    if(!r.ok) throw new Error('ntfy write ' + r.status);
  }
};

/* ---------- Google 로그인 게이트 ---------- */
function authEmail(){ return (AUTH.user && AUTH.user.email) || ''; }
function isOwner(){ return authEmail().trim().toLowerCase() === OWNER_EMAIL; }
function canChooseJingyu(){ return !AUTH.required || (isOwner() && AUTH.user.emailVerified === true); }
function authAvailable(){ return !!(window.firebase && window.firebase.auth); }

function showAuthGate(){
  const g = $('#authGate'), card = $('#authGateCard');
  if(!g || !card) return;
  const email = authEmail();
  let inner;
  if(!authAvailable()){
    AUTH.error = 'sdk';
    inner = '<p>로그인 모듈(Firebase SDK)을 불러오지 못했습니다. 네트워크를 확인하고 다시 시도해 주세요.</p>'
      + '<button class="agbtn" id="agReload">다시 불러오기</button>';
  } else if(AUTH.denied){
    inner = '<p>로그인은 됐지만 <b>이 현장에 들어갈 권한이 없는 계정</b>입니다. 허용된 계정으로 다시 로그인해 주세요.</p>'
      + '<span class="agmail">' + esc(email || '알 수 없는 계정') + '</span>'
      + '<button class="agbtn" id="agSwitch">다른 Google 계정으로 로그인</button>'
      + '<button class="agbtn ghost" id="agOut">로그아웃</button>';
  } else {
    inner = '<p>현장 무전은 <b>Google 로그인</b>한 사람만 보고 쓸 수 있습니다. 허용된 계정으로 들어와 주세요.</p>'
      + '<button class="agbtn" id="agSignIn">Google로 로그인</button>'
      + '<div class="agnote">허용 계정: ' + esc(OWNER_EMAIL) + ' · 가족·동료 계정은 현장주가 <b>인력 현황 → 🔐 접근 권한</b> 에서 추가합니다.</div>';
  }
  card.innerHTML = '<div class="aghat">👷</div><h2>노가다 현장 합동 비서실</h2>' + inner;
  g.hidden = false;
  const on = (id, fn) => { const b = $('#' + id); if(b) b.addEventListener('click', fn); };
  on('agSignIn', signInGoogle);
  on('agSwitch', async () => { await signOutApp(); setTimeout(signInGoogle, 150); });
  on('agOut', signOutApp);
  on('agReload', () => location.reload());
}
function hideAuthGate(){ const g = $('#authGate'); if(g) g.hidden = true; }

async function signInGoogle(){
  if(AUTH.busy) return;
  if(!authAvailable()){ AUTH.error = 'sdk'; showAuthGate(); return; }
  const fb = window.firebase;
  const provider = new fb.auth.GoogleAuthProvider();
  try{ provider.setCustomParameters({ prompt: 'select_account' }); }catch(e){}
  AUTH.busy = true;
  const btn = $('#agSignIn'); if(btn){ btn.disabled = true; btn.textContent = 'Google 로그인 중…'; }
  try{
    await fb.auth().signInWithPopup(provider);
  }catch(e){
    const code = (e && e.code) || '';
    if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
      /* 사용자가 창을 닫은 경우 — 그대로 둡니다 */
    } else if(code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment'
              || code === 'auth/web-storage-unsupported'){
      try{ await fb.auth().signInWithRedirect(provider); }catch(e2){ toast('로그인 실패: ' + ((e2 && e2.code) || '알 수 없음')); }
    } else if(code === 'auth/unauthorized-domain'){
      toast('이 주소는 Firebase 승인된 도메인에 없습니다');
    } else {
      toast('로그인 실패: ' + (code || '알 수 없음'));
    }
  } finally {
    AUTH.busy = false;
    const b2 = $('#agSignIn'); if(b2){ b2.disabled = false; b2.textContent = 'Google로 로그인'; }
  }
}

async function signOutApp(){
  try{ if(authAvailable()) await firebase.auth().signOut(); }catch(e){}
  AUTH.user = null; AUTH.token = ''; AUTH.tokenAt = 0; AUTH.denied = '';
  AUTH.allowed = {}; AUTH.allowedLoaded = false;
  Wire.closeStream();
  S.conn = 'login';
  showAuthGate(); render();
}

/* RTDB가 401/403을 주면(계정이 허용 목록에 없음) 로그인 화면에 이유를 보여 줍니다. */
function authDenied(){
  if(!AUTH.required || AUTH.denied) return;
  AUTH.denied = authEmail() || '이 계정';
  S.conn = 'denied';
  Wire.closeStream();
  try{ $('#connDot').className = 'dot retry'; $('#connTxt').textContent = '접근 권한 없음'; }catch(e){}
  showAuthGate();
}

/* 현장주 전용: 허용 이메일 목록(RTDB allowedEmails). 이메일의 '.' 은 ',' 로 저장합니다. */
function allowedKey(email){ return String(email || '').trim().toLowerCase().replace(/\./g, ','); }
async function loadAllowedEmails(){
  if(Wire.mode !== 'rtdb' || !isOwner()) return;
  try{
    await Wire.ensureToken();
    const r = await fetch(Wire.query('/allowedEmails', 't=' + now()));
    if(!r.ok) return;
    const v = await r.json();
    AUTH.allowed = (v && typeof v === 'object') ? v : {};
    AUTH.allowedLoaded = true;
    render();
  }catch(e){}
}
async function putAllowedEmail(email, value){
  const key = allowedKey(email);
  if(!key) return false;
  try{
    await Wire.ensureToken();
    const r = await fetch(Wire.query('/allowedEmails/' + encodeURIComponent(key)), {
      method: value ? 'PUT' : 'DELETE',
      body: value ? 'true' : undefined,
      headers: value ? { 'Content-Type': 'application/json' } : undefined
    });
    if(!r.ok) throw new Error('rules ' + r.status);
    if(value) AUTH.allowed[key] = true; else delete AUTH.allowed[key];
    render();
    return true;
  }catch(e){ toast('권한 저장 실패'); return false; }
}

function applyEnvelope(env){
  if(!env || !env.t) return;
  const d = env.d || {};
  if(env.t === 'msg') applyRemoteMsg(d);
  else if(env.t === 'task') applyRemoteTask(d.id, d);
  else if(env.t === 'del-task') delete S.tasks[d.id];
  else if(env.t === 'agent') applyRemoteAgent(d.id, d);
  else if(env.t === 'del-agent') delete S.agents[d.id];
  else if(env.t === 'state'){ mergeAgents(d.agents || {}); mergeTasks(d.tasks || {}); }
  else if(env.t === 'hello'){ /* 새 참가자에게 상태 알려주기 */ if(Object.keys(S.agents).length) announceState(); }
  render(); persistState();
}
function announceState(){
  Wire.push({ t:'state', ts: now(), d:{ agents: S.agents, tasks: S.tasks } }).catch(()=>{});
}

/* ---------- 동작 ---------- */
function sendMessage(text){
  text = (text || '').trim();
  if(!text) return;
  const m = { id:'m-' + uid(), from: S.me.id, name: S.me.name, emoji: S.me.emoji, text, ts: now() };
  S.messages[m.id] = m;
  render(); persistState();
  Wire.push({ t:'msg', ts: m.ts, d: m }).catch(()=> toast('무전 실패 — 잠시 후 다시'));
  /* 이름을 바꿔도 @새이름·@제미나이·@gemini 모두 같은 봇을 부릅니다. */
  const called = mentionedAgentIds(text);
  if(called.indexOf('groq') >= 0) setTimeout(()=> askGroq(m), 150);
  if(called.indexOf('gemini') >= 0) setTimeout(()=> askGemini(m), 150);
  setTimeout(scrollChatBottom, 30);
}
function upsertTask(t){
  t.updatedAt = now();
  S.tasks[t.id] = t; render(); persistState();
  Wire.push({ t:'task', ts: t.updatedAt, d: t }).catch(()=> toast('동기화 실패'));
}
function removeTask(id){
  delete S.tasks[id]; render(); persistState();
  Wire.push({ t:'del-task', ts: now(), d:{ id } }).catch(()=>{});
}
function upsertAgent(a){
  a.updatedAt = now();
  S.agents[a.id] = a; rememberName(a); render(); persistState();
  /* ?db=off(미리보기·ntfy 임시 모드)에서는 저장이 원래 이 브라우저에만 됩니다 —
     중계가 안 닿아도 '동기화 실패'로 새 이름 저장을 의심하게 만들지 않습니다. */
  Wire.push({ t:'agent', ts: a.updatedAt, d: a }).catch(()=>{ if(Wire.mode === 'rtdb') toast('동기화 실패 — 이름은 이 기기에 저장됐습니다'); });
}
function removeAgent(id){
  delete S.agents[id]; render(); persistState();
  Wire.push({ t:'del-agent', ts: now(), d:{ id } }).catch(()=>{});
}
/* 제미나이·그록은 어느 현장(방)에나 상주합니다. 명단에 없으면 다시 투입합니다.
   단, 첫 동기화(pull) 전에는 DB에 쓰지 않습니다. 저장된 새 이름을 기본 이름으로 덮어쓰지 않게. */
const CORE_AGENTS = ['gemini', 'groq'];
function ensureCoreAgents(){
  let changed = false;
  CORE_AGENTS.forEach(id => {
    if(S.agents[id]) return;
    const a = applyNameMemo(Object.assign({}, SEED_AGENTS[id], { updatedAt: 1 }));
    S.agents[id] = a; changed = true; rememberName(a);
    if(S.pulled) Wire.push({ t:'agent', ts: a.updatedAt, d: a }).catch(()=>{});
  });
  if(changed){ render(); persistState(); }
}
/* 첫 동기화 뒤에도 서버에 없던 씨앗 인력은 '방금' 시각으로 한 번 올려 둡니다. */
function stampSeedAgents(){
  let changed = false;
  Object.values(S.agents).forEach(a => {
    if((a.updatedAt || 0) <= 1){
      a.updatedAt = now(); changed = true;
      Wire.push({ t:'agent', ts: a.updatedAt, d: a }).catch(()=>{});
    }
  });
  if(changed){ render(); persistState(); }
}

/* ---------- 렌더 ---------- */
let rafPending = false;
function render(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    renderHeader();
    if(S.tab === 'map') renderMap();
    if(S.tab === 'chat') renderChat();
    if(S.tab === 'tasks') renderTasks();
    if(S.tab === 'crew') renderCrew();
    renderBadge();
  });
}
function renderHeader(){
  const who = $('#authWho');
  if(who){
    who.textContent = AUTH.required ? (authEmail() ? '🔐 ' + authEmail() : '🔐 로그인 필요') : '';
    who.title = AUTH.required ? 'Google 로그인 계정' : '';
  }
  if(!S.me) return;
  $('#meEmoji').textContent = S.me.emoji;
  $('#meName').textContent = S.me.name;
}
function renderBadge(){
  const b = $('#chatBadge');
  if(S.unread > 0 && S.tab !== 'chat'){ b.textContent = S.unread > 9 ? '9+' : S.unread; b.style.display = 'grid'; }
  else b.style.display = 'none';
}
function agentsIn(zone){ return Object.values(S.agents).filter(a => a.zone === zone); }
/* 상태별로 지금 어디서 무엇을 하는지 — 지도 캐릭터 툴팁·토스트·상태판이 같은 문구를 씁니다. */
function whereLabel(a){
  const st = a.status;
  if(st === '작업중')  return (ZONES[a.zone] || ZONES.work).name + '에서 작업';
  if(st === '무전대기') return (ZONES[a.zone] || ZONES.office).name + ' · 무전 대기';
  if(st === '식사중')   return '라운지에서 식사';
  if(st === '합류대기') return '라운지 입구에서 대기';
  if(st === '외근')     return '외근 중';
  return '라운지에서 휴식';
}

function renderMap(){
  const el = $('#view-map');
  const agents = Object.values(S.agents);
  const seated = {};
  /* 같은 자리로 몰리는 캐릭터를 한 칸씩 밀어 겹치지 않게 앉힙니다. */
  function seat(kind, list){
    const n = (seated[kind] = (seated[kind] || 0) + 1);
    const s = list[(n - 1) % list.length], extra = Math.floor((n - 1) / list.length);
    return { i: n - 1, x: Math.min(94, s[0] + extra * 4), y: Math.min(94, s[1] + extra * 5) };
  }
  /* 상태에 따른 몸 위치: 작업중 = 자기 구역 책상 / 대기중 = 라운지(자율적으로 어슬렁) / 합류대기 = 라운지 입구 */
  function poseOf(a){
    const st = a.status;
    if(st === '작업중'){
      const zk = ZONES[a.zone] ? a.zone : 'work', p = seat('w:' + zk, ZONES[zk].spots);
      return { zone: zk, state: 'working', badge: '⚡', x: p.x, y: p.y, where: whereLabel(a) };
    }
    if(st === '무전대기'){
      const zk = ZONES[a.zone] ? a.zone : 'office', p = seat('r:' + zk, ZONES[zk].spots);
      return { zone: zk, state: 'radio', badge: '📻', x: p.x, y: p.y, where: whereLabel(a) };
    }
    if(st === '식사중'){
      const p = seat('eat', LOUNGE_SEATS);
      return { zone: 'break', state: 'eating', badge: '🍽️', x: p.x, y: p.y, where: whereLabel(a) };
    }
    if(st === '합류대기'){
      const p = seat('door', LOUNGE_DOOR);
      return { zone: 'break', state: 'joining', badge: '🙋', x: p.x, y: p.y, where: whereLabel(a) };
    }
    if(st === '외근'){
      const p = seat('away', LOUNGE_DOOR);
      return { zone: 'break', state: 'away', badge: '🚶', x: p.x, y: p.y, where: whereLabel(a) };
    }
    const p = seat('lounge', LOUNGE_SEATS);
    const r = ensureRoam(a.id, p.x, p.y);
    const walking = !!(r && r.walkingUntil && r.walkingUntil > now());
    return { zone: 'break', state: walking ? 'walking' : 'idle', walking: walking,
             face: !!(r && r.face), badge: p.i % 2 ? '💤' : '☕',
             x: r ? r.x : p.x, y: r ? r.y : p.y, where: whereLabel(a) };
  }
  const poses = {};
  agents.forEach(a => { poses[a.id] = poseOf(a); });
  const zoneCount = {};
  Object.keys(poses).forEach(id => { const p = poses[id]; zoneCount[p.zone] = (zoneCount[p.zone] || 0) + 1; });

  const zones = Object.keys(ZONES).map(k => {
    const z = ZONES[k], n = zoneCount[k] || 0;
    const busy = Object.keys(poses).some(id => poses[id].state === 'working' && poses[id].zone === k);
    return '<button class="zone' + (busy ? ' busy' : '') + '" data-zone="' + k + '" style="left:' + z.lx + '%;top:' + z.ly + '%" aria-label="' + z.name + '">'
      + (n ? '<span class="zc">' + n + '</span>' : '')
      + '<span class="zn">' + z.emoji + ' ' + z.name + '</span>'
      + '</button>';
  }).join('');

  /* 지도 뼈대(그림·캐릭터 레이어)는 한 번만 만들고 다시 그리지 않습니다.
     요소가 문서에서 떼어졌다 붙으면 CSS transition 이 끊겨 걷는 모습이 사라지기 때문입니다. */
  let wrap = el.querySelector('.mapwrap');
  if(!wrap){
    el.innerHTML = ''
      + '<div class="mapwrap"><img src="' + IMG + '" alt="스마트 오피스 3D 지도"><div class="actor-layer"></div></div>'
      + '<div class="mapmeta"></div>'
      + '<div class="card nowcard">'
      +   '<div class="sec-title">🛰️ 지금 오피스<span class="line"></span></div>'
      +   '<div class="nowlist"></div>'
      +   '<div class="maphint">구역을 누르면 인력 이동 · 캐릭터를 누르면 상태 확인 · 이름 변경</div>'
      + '</div>';
    wrap = el.querySelector('.mapwrap');
  }

  const working = agents.filter(a => a.status === '작업중').length;
  const openTasks = Object.values(S.tasks).filter(t => t.status !== 'done').length;

  /* 구역 이름표는 매번 새로 그립니다(움직이지 않으므로 상관없음) */
  wrap.querySelectorAll('.zone').forEach(n => n.remove());
  wrap.insertAdjacentHTML('beforeend', zones);

  el.querySelector('.mapmeta').innerHTML = ''
    + '<span class="pill">👥 출근 <b>' + agents.length + '명</b></span>'
    + '<span class="pill">⚡ 작업중 <b>' + working + '명</b></span>'
    + '<span class="pill">📋 남은 일 <b>' + openTasks + '건</b></span>'
    + '<span class="pill">💬 무전 <b>' + visibleMessages().length + '건</b></span>';

  el.querySelector('.nowlist').innerHTML = agents.length ? agents.map(a =>
      '<div class="nowrow" data-watch="' + esc(a.id) + '">'
      + '<div class="nav">' + charSvg(a) + '</div>'
      + '<div style="flex:1;min-width:0"><div class="nname">' + esc(a.name) + '</div>'
      + '<div class="nsub">' + esc(a.role || '') + ' · ' + esc(poses[a.id].where) + '</div></div>'
      + '<span class="statuspill st-' + esc(a.status) + '">' + esc(a.status) + '</span>'
      + '</div>').join('')
    : '<div class="empty">아직 출근한 인력이 없습니다. 인력 현황에서 추가하세요.</div>';

  syncActors(wrap.querySelector('.actor-layer'), agents, poses);
}

/* 지도 위 캐릭터 요소를 재사용하면서 상태·자리·이름표만 갱신합니다. */
function syncActors(layer, agents, poses){
  const seen = {};
  const selOn = id => S.selId === id && now() < S.selUntil;
  agents.forEach(a => {
    const p = poses[a.id];
    if(!p) return;
    seen[a.id] = 1;
    let btn = null;
    for(let i = 0; i < layer.children.length; i++){
      if(layer.children[i].getAttribute('data-agent') === a.id){ btn = layer.children[i]; break; }
    }
    if(!btn){
      btn = document.createElement('button');
      btn.className = 'actor';
      btn.type = 'button';
      btn.setAttribute('data-agent', a.id);
      btn.innerHTML = '<span class="chwrap"></span><span class="nm"></span>';
      layer.appendChild(btn);
    }
    /* 캐릭터 그림은 5종은 고정, 새 인력은 이름 첫 글자를 쓰므로 이름이 바뀌면 다시 그립니다. */
    const sig = a.id + '|' + (CHAR_DRAW[a.id] ? '' : (a.name || ''));
    if(btn.getAttribute('data-sig') !== sig){
      btn.setAttribute('data-sig', sig);
      btn.querySelector('.chwrap').innerHTML = charSvg(a) + '<span class="bd"></span>';
    }
    const ch = btn.querySelector('.ch');
    if(ch && ch.classList.contains('face-left') !== !!p.face) ch.classList.toggle('face-left', !!p.face);
    const cls = 'actor ' + p.state + (p.walking && p.state !== 'walking' ? ' walking' : '') + (selOn(a.id) ? ' sel' : '');
    if(btn.className !== cls) btn.className = cls;
    btn.setAttribute('data-state', p.state);
    if(btn.style.left !== p.x + '%') btn.style.left = p.x + '%';
    if(btn.style.top !== p.y + '%') btn.style.top = p.y + '%';
    /* 아래(y가 큰) 캐릭터가 앞에 보이도록 — 2.5D 느낌(구역 이름표보다는 아래) */
    btn.style.zIndex = String(3 + Math.round(p.y * 0.3));
    const label = a.name + ' · ' + a.status + ' · ' + p.where;
    if(btn.getAttribute('aria-label') !== label) btn.setAttribute('aria-label', label);
    const bd = btn.querySelector('.bd');
    if(bd && bd.textContent !== p.badge) bd.textContent = p.badge;
    const nm = btn.querySelector('.nm'), sn = shortName(a.name);
    if(nm && nm.textContent !== sn) nm.textContent = sn;
  });
  /* 명단에서 빠진 인력의 캐릭터는 지웁니다. */
  for(let i = layer.children.length - 1; i >= 0; i--){
    const c = layer.children[i];
    if(!seen[c.getAttribute('data-agent')]) layer.removeChild(c);
  }
}

    +   '<div class="chat-row">'

function renderTasks(){
  const el = $('#view-tasks');
  const groups = [
    { k:'todo', label:'대기', cls:'' },
    { k:'work', label:'진행중', cls:'s-work' },
    { k:'done', label:'완료', cls:'s-done' }
  ];
  const all = Object.values(S.tasks);
  const ownerOpts = Object.values(S.agents).map(a => '<option value="' + esc(a.id) + '">' + esc(a.emoji + ' ' + a.name) + '</option>').join('');

  let body = '';
  groups.forEach(g => {
    const list = all.filter(t => (t.status || 'todo') === g.k).sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
    body += '<div class="tsec">' + g.label + ' <span class="cnt">' + list.length + '</span></div>';
    body += list.length ? list.map(t => {
      const owner = S.agents[t.owner];
      const next = g.k === 'todo' ? 'work' : g.k === 'work' ? 'done' : 'todo';
      const nextLabel = g.k === 'todo' ? '▶' : g.k === 'work' ? '✔' : '↺';
      return '<div class="task ' + g.cls + '">'
        + '<div style="flex:1;min-width:0">'
        +   '<div class="tt">' + esc(t.title) + '</div>'
        +   '<div class="tm">' + (owner ? '<span>' + owner.emoji + ' ' + esc(owner.name) + '</span>' : '<span>담당 미정</span>')
        +     '<span>· ' + ago(t.updatedAt) + '</span></div>'
        + '</div>'
        + '<div class="acts">'
        +   '<button class="iconbtn" data-adv="' + esc(t.id) + '" data-to="' + next + '" title="상태 변경">' + nextLabel + '</button>'
        +   '<button class="iconbtn" data-del="' + esc(t.id) + '" title="삭제">🗑</button>'
        + '</div></div>';
    }).join('') : '<div class="empty" style="padding:8px">없음</div>';
  });

  el.innerHTML = ''
    + '<div class="card">'
    +   '<div class="sec-title">📋 작업 일지<span class="line"></span></div>'
    +   body
    +   '<div class="addform">'
    +     '<div class="line"><input type="text" id="taskTitle" placeholder="새 작업 (예: 3층 거푸집 해체)"></div>'
    +     '<div class="line">'
    +       '<select id="taskOwner"><option value="">담당자 선택</option>' + ownerOpts + '</select>'
    +       '<button class="btn" id="addTask" style="flex:0 0 auto">추가</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';

  $('#addTask').addEventListener('click', ()=>{
    const t = $('#taskTitle').value.trim();
    if(!t) { toast('작업 내용을 입력하세요'); return; }
    upsertTask({ id:'t-' + uid(), title:t, owner: $('#taskOwner').value || '', status:'todo', ts: now() });
    $('#taskTitle').value = '';
  });
  $('#taskTitle').addEventListener('keydown', e => { if(e.key === 'Enter') $('#addTask').click(); });
  el.querySelectorAll('[data-adv]').forEach(b => b.addEventListener('click', ()=>{
    const t = S.tasks[b.dataset.adv]; if(!t) return;
    const nt = Object.assign({}, t, { status: b.dataset.to });
    upsertTask(nt);
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=>{
    if(confirm('이 작업을 지울까요?')) removeTask(b.dataset.del);
  }));

function buildGeminiPrompt(msg){
  const list = visibleMessages();
  const i = list.findIndex(m => m.id === msg.id);
  const before = (i >= 0 ? list.slice(0, i) : list).filter(m => !m.sys).slice(-6);
  const line = m => (m.name || '무명') + ': ' + String(m.text || '').replace(/\s+/g, ' ').slice(0, 300);
  const ctx = before.length ? before.map(line).join('\n') : '(아직 없음)';
  return '[최근 무전 기록]\n' + ctx
    + '\n\n[지금 온 무전]\n' + line(msg)
    + '\n\n위 무전에 제미나이로서 답해라. 답변 본문만 써라.';
}

function geminiSleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

/* 모델 하나를 호출합니다. 응답 지연은 AbortController로 끊습니다.
   opts.tools === false 이면 구글 검색 도구를 빼고 호출합니다(도구를 거절하는 모델 대비). */
async function geminiCallModel(model, promptText, key, timeoutMs, opts){
  const useTools = !(opts && opts.tools === false);
  /* 3.x: 샘플링 파라미터·thinkingConfig 없이 maxOutputTokens만. thinking이 기본으로 켜져 있어
     그 토큰까지 같은 한도에서 나가므로 2048로 잡는다(작으면 본문이 빈 채로 끝난다). */
  const gen = model.family === 3
    ? { maxOutputTokens: 2048 }
    : { temperature: 0.85, maxOutputTokens: 1200, topP: 0.95 };
  if(model.thinking) gen.thinkingConfig = { thinkingBudget: 0 }; /* 2.5 계열에만 */
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model.id
    + ':generateContent?key=' + encodeURIComponent(key);

  let timer = null, ctrl = null, timedOut = false;
  if(typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    timer = setTimeout(() => { timedOut = true; try{ ctrl.abort(); }catch(e){} }, timeoutMs);
  }
  try{
    const payload = {
      systemInstruction: { parts: [{ text: geminiPersonaText() }] },
      contents: [{ role: 'user', parts: [{ text: promptText }] }],
      generationConfig: gen
    };
    if(useTools) payload.tools = GEMINI_SEARCH_TOOLS; /* 실시간 구글 검색 */
    const opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    };
    if(ctrl) opt.signal = ctrl.signal;
    const r = await fetch(url, opt);
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    return { r, data, timedOut: timedOut };
  }catch(e){
    return { r: null, data: null, timedOut: timedOut || !!(e && e.name === 'AbortError'), netErr: e };
  }finally{
    if(timer) clearTimeout(timer);
  }
}

/* 그라운딩 결과에서 출처 제목 1~2개를 뽑습니다(무전기에는 글자로만 보입니다). */
function geminiSources(data){
  const cand = ((data && data.candidates) || [])[0] || {};
  const gm = cand.groundingMetadata || (data && data.groundingMetadata) || {};
  const chunks = gm.groundingChunks || [];
  const out = [];
  chunks.forEach(ch => {
    const web = (ch && ch.web) || {};
    let label = String(web.title || '').trim();
    if(!label && web.uri){
      try{ label = String(new URL(web.uri).hostname).replace(/^www\./, ''); }catch(e){ label = ''; }
    }
    if(!label) return;
    if(label.length > 26) label = label.slice(0, 26).trim() + '…';
    if(out.indexOf(label) < 0) out.push(label);
  });
  return out.slice(0, 2);
}
/* 답 본문 끝에 출처를 한 줄로 붙입니다(본문에 이미 그 이름이 있으면 생략). */
function withGeminiSources(text, data){
  const src = geminiSources(data);
  if(!src.length) return text;
  if(src.some(s => text.indexOf(s.replace(/…$/, '')) >= 0)) return text;
  return text + '\n\n🔎 출처: ' + src.join(' · ');
}

/* 503·429·404·5xx·응답 지연·빈 응답이면 다음 모델로 넘어가 계속 시도합니다.
   검색 도구(tools)를 400으로 거절하는 모델은 같은 모델을 도구 없이 한 번 더 불러 답을 얻습니다.
   모든 모델이 막혔을 때만 사용자에게 안내합니다. */
async function geminiFetch(promptText, key){
  const started = Date.now();
  const tried = [];
  const pushTried = id => { if(tried.indexOf(id) < 0) tried.push(id); };
  let lastModelErr = '';
  let sawBusy = false, sawQuota = false, sawTimeout = false, sawNetwork = false, sawNotFound = false, sawEmpty = false;

  for(let i = 0; i < GEMINI_MODELS.length; i++){
    const model = GEMINI_MODELS[i];
    if(GEMINI_TOTAL_BUDGET_MS - (Date.now() - started) <= 500) break; /* 전체 예산 소진 */
    let useTools = true;

    for(let pass = 0; pass < 2; pass++){
      const left = GEMINI_TOTAL_BUDGET_MS - (Date.now() - started);
      if(left <= 500) break; /* 전체 예산 소진 — 남은 모델은 건너뛴다 */
      const res = await geminiCallModel(model, promptText, key, Math.min(GEMINI_ATTEMPT_TIMEOUT_MS, left), { tools: useTools });

      if(res.r && res.r.ok && res.data){
        const cand = (res.data.candidates || [])[0];
        const parts = (cand && cand.content && cand.content.parts) || [];
        const out = parts.map(p => (p && p.text) ? p.text : '').join('').trim();
        if(out) return { text: withGeminiSources(out, res.data), model: model.id, tried: tried, sources: geminiSources(res.data) };
        /* 200인데 본문이 없다 = thinking이 maxOutputTokens를 다 쓴 경우(MAX_TOKENS)·안전 차단 등
           → 다음 모델로 넘어간다 */
        const why = (cand && cand.finishReason) || (res.data.promptFeedback && res.data.promptFeedback.blockReason) || '';
        pushTried(model.id);
        sawEmpty = true;
        lastModelErr = '본문 없음' + (why ? '(' + why + ')' : '');
        break;
      }

      if(!res.r){
        /* 망 지연·시간초과·일시적 연결 실패 → 다음 모델로 재시도 */
        pushTried(model.id);
        if(res.timedOut) sawTimeout = true; else sawNetwork = true;
        lastModelErr = res.timedOut ? '응답 지연(timeout)' : 'network: ' + String((res.netErr && res.netErr.message) || res.netErr || '');
        break;
      }

      const status = res.r.status;
      const err = (res.data && res.data.error) || {};
      const msg = String(err.message || err.status || '');
      lastModelErr = msg || ('HTTP ' + status);

      if(status === 400 && /api key not valid|api_key_invalid|invalid api key|api key expired/i.test(msg)){
        throw { kind: 'key', userMessage: '🔑 제미나이 API 키가 거부됐습니다(400). 인력 현황 → 🔑 제미나이 API 키 설정에서 키를 다시 넣어주세요.' };
      }
      if(status === 403){
        throw { kind: 'perm', userMessage: '🚫 이 키로는 호출 권한이 없습니다(403). Google AI Studio에서 키 상태·생성형 언어 API 사용 설정을 확인해 주세요.' };
      }

      /* 검색 도구(tools/google_search)를 모르거나 거절하는 모델 → 같은 모델을 도구 없이 한 번 더 */
      if(status === 400 && useTools && /tool|google[ _]?search|grounding|search[ _]?query|function ?(declaration|calling)/i.test(msg)){
        useTools = false;
        continue;
      }

      /* 404(모델 없음) · 429(한도) · 503(과부하) · 5xx(일시 장애) → 다음 모델로 재시도
         400이어도 thinkingConfig·generationConfig 같은 파라미터를 모르는 모델이면 다음 모델로 넘긴다
         (2.5 → 3.x 자동 라우팅처럼 모델 쪽이 바뀌어도 여기서 살아난다) */
      const retriable = GEMINI_RETRY_STATUS.indexOf(status) >= 0
        || /high demand|overloaded|unavailable|resource[ _]?exhausted|rate limit|try again later|not[ _]?found|not supported|does not exist|unknown model|internal error/i.test(msg)
        || (status === 400 && /thinking|generation_?config|unknown (name|field)|unsupported/i.test(msg));
      if(!retriable){
        throw { kind: 'api', userMessage: '🤖 제미나이 호출이 실패했습니다(' + status + '). ' + msg.slice(0, 120) };
      }
      pushTried(model.id);
      if(status === 503) sawBusy = true;
      if(status === 429) sawQuota = true;
      if(status === 404) sawNotFound = true;
      break;
    }

    if(i < GEMINI_MODELS.length - 1) await geminiSleep(GEMINI_RETRY_DELAY_MS);
  }

  /* 모든 모델 소진 — 원인에 맞게 한 번만 알린다 */
  const detail = ' (시도: ' + (tried.join(' → ') || '-') + ')' + (lastModelErr ? ' · ' + String(lastModelErr).slice(0, 80) : '');
  if(sawBusy){
    throw { kind: 'busy', userMessage: '⏳ 지금 제미나이 모델이 모두 붐빕니다(503 — 일시적 수요 폭주). 1~2분 뒤에 다시 불러주세요.' + detail };
  }
  if(sawQuota){
    throw { kind: 'quota', userMessage: '⏳ 제미나이 호출 한도를 넘었습니다(429). 1분쯤 뒤에 다시 불러주세요.' + detail };
  }
  if(sawTimeout || sawNetwork){
    throw { kind: 'network', userMessage: '📡 제미나이 서버 응답이 늦거나 무전망(인터넷)이 불안정합니다. 잠시 뒤 다시 불러주세요.' + detail };
  }
  if(sawNotFound){
    throw { kind: 'model', userMessage: '🤖 쓸 수 있는 제미나이 모델을 찾지 못했습니다. Gemini API 키에서 사용 가능한 모델을 확인해 주세요.' + detail };
  }
  if(sawEmpty){
    throw { kind: 'empty', userMessage: '🤖 제미나이 답이 비어 있습니다. 질문을 조금 바꿔 다시 불러주세요.' + detail };
  }
  throw { kind: 'api', userMessage: '🤖 제미나이 호출이 실패했습니다. 잠시 뒤 다시 불러주세요.' + detail };
}

function askGemini(msg){
  const key = geminiKey();
  if(!key){
    S.geminiNoKeyHint = true;
    render();
    toast('🔑 제미나이 API 키가 없습니다 — [인력 현황]에서 넣어주세요');
    return Promise.resolve(null);
  }
  if(S.geminiBusy){
    toast('🤖 제미나이가 이전 무전에 답하는 중입니다');
    return Promise.resolve(null);
  }
  S.geminiBusy = true;
  S.geminiNoKeyHint = false;
  const base = S.agents.gemini || Object.assign({}, SEED_AGENTS.gemini);
  upsertAgent(Object.assign({}, base, { status: '작업중', zone: 'work' }));
  render();
  return geminiFetch(buildGeminiPrompt(msg), key)
    .then(res => postAiMessage(res.text, { model: res.model }))
    .catch(err => {
      if(err && err.kind === 'key') S.geminiNoKeyHint = true;
      postAiMessage((err && err.userMessage) || '🤖 제미나이 호출이 살패했습니다.', { error: true });
      return null;
    })
    .then(m => {
      S.geminiBusy = false;
      const back = Object.assign({}, S.agents.gemini || base, { status: '대기중', zone: 'work' });
      upsertAgent(back);
      render();
      return m;
    });
}
function postAiMessage(text, extra){
  const x = Object.assign({}, extra || {});
  const id = x.via || x.from || 'gemini';
  const a = agentById(id) || SEED_AGENTS.gemini;
  const m = Object.assign({ id:'m-' + uid(), from: id, name: a.name, emoji: a.emoji,
                            text:String(text || ''), ts: now(), via: id, ai:true }, x);
  S.messages[m.id] = m;
  render(); persistState();
  Wire.push({ t:'msg', ts: m.ts, d: m }).catch(()=>{});
  setTimeout(scrollChatBottom, 30);
  return m;
}

/* ---------- 그록(Groq) 즉답 ----------
   OpenAI 호환 규격(POST /openai/v1/chat/completions)에 Bearer 키로 호출합니다.
   키는 이 브라우저 localStorage(nogada_groq_key)에만 저장합니다. */
function groqKey(){
  try{ return (localStorage.getItem(GROQ_KEY_LS) || '').trim(); }catch(e){ return ''; }
}
function groqSetKey(v){
  try{
    if(v) localStorage.setItem(GROQ_KEY_LS, String(v).trim());
    else localStorage.removeItem(GROQ_KEY_LS);
  }catch(e){ toast('브라우저 저장이 막혀 있습니다'); }
}

/* ---------- Tavily 실시간 웹 검색 ---------- */
function tavilyKey(){
  try{ return (localStorage.getItem(TAVILY_KEY_LS) || '').trim(); }catch(e){ return ''; }
}
function tavilySetKey(v){
  try{
    if(v) localStorage.setItem(TAVILY_KEY_LS, String(v).trim());
    else localStorage.removeItem(TAVILY_KEY_LS);
  }catch(e){ toast('브라우저 저장이 막혀 있습니다'); }
}

/* 오늘 날짜·시각(KST)을 그록 프롬프트에 넣어 '오늘'을 알게 한다. */
function kstStamp(){
  const p = n => String(n).padStart(2, '0');
  const t = new Date(Date.now() + 9 * 3600 * 1000); /* KST = UTC+9 (서머타임 없음) */
  const yo = ['일','월','화','수','목','금','토'][t.getUTCDay()];
  return t.getUTCFullYear() + '-' + p(t.getUTCMonth() + 1) + '-' + p(t.getUTCDate())
    + ' (' + yo + ') ' + p(t.getUTCHours()) + ':' + p(t.getUTCMinutes()) + ' KST';
}

/* 멘션(@그록·@groq)을 걷어낸 실제 질문 */
function groqQuestionText(msg){
  return String((msg && msg.text) || '')
    .replace(/@\s*(그록|groq)/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* 인사·고마움·테스트 같은 잡담에는 검색을 걸지 않는다(월 1,000건 무료 쿼터 절약). */
const GROQ_CHITCHAT_RE = /^(안녕|안냥|하이|헬로|반가워|반갑습니다|고마워|고맙습니다|감사|감사합니다|땡큐|수고|수고했어|수고하셨습니다|수고많았어|잘했어|잘한다|ㅇㅋ|ㅇㅇ|오케이|오키|ok|okay|굿|좋아|좋네|좋다|네|넵|예|응|테스트|테스트중|테스트입니다|test|핑|ping|ㅎㅇ|ㅋㅋ|ㅎㅎ)[\s!~.,ㅋㅎ👍🙏😀]*$/i;
function isGroqChitchat(text){
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if(!t) return true;
  if(GROQ_CHITCHAT_RE.test(t)) return true;
  return false;
}

/* Tavily Search API 호출. 8초 안에 답이 없거나 401·429·망 오류면 ok:false로 돌려주고,
   부른 쪽(askGroq)은 검색 없이 그록에게 그대로 넘긴다. */
async function tavilySearch(query, key, opts){
  const q = String(query || '').trim();
  if(!q) return { ok: false, reason: 'empty' };
  const o = opts || {};
  const timeoutMs = o.timeoutMs || TAVILY_TIMEOUT_MS;
  const payload = {
    api_key: key,                 /* 예전 방식도 계속 동작 — 함께 보내 두면 어느 쪽이든 통한다 */
    query: q.slice(0, 400),
    search_depth: 'basic',
    max_results: TAVILY_MAX_RESULTS,
    include_answer: true
  };

  let timer = null, ctrl = null, timedOut = false;
  if(typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    timer = setTimeout(() => { timedOut = true; try{ ctrl.abort(); }catch(e){} }, timeoutMs);
  }
  try{
    const opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(payload)
    };
    if(ctrl) opt.signal = ctrl.signal;
    const r = await fetch(TAVILY_ENDPOINT, opt);
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    if(!r.ok){
      const err = (data && (data.detail || data.error)) || {};
      const msg = typeof err === 'string' ? err : String((err && (err.error || err.message)) || '');
      return { ok: false, reason: r.status === 401 || r.status === 403 ? 'key' : (r.status === 429 ? 'quota' : 'api'),
               status: r.status, message: msg.slice(0, 160) };
    }
    if(!data || !Array.isArray(data.results)) return { ok: false, reason: 'empty' };
    const results = data.results.slice(0, TAVILY_MAX_RESULTS).map(x => ({
      title: String((x && x.title) || '').trim(),
      url: String((x && x.url) || '').trim(),
      content: String((x && x.content) || '').trim()
    })).filter(x => x.title || x.url);
    if(!results.length && !data.answer) return { ok: false, reason: 'empty' };
    return {
      ok: true,
      query: String(data.query || q),
      answer: String(data.answer || '').trim(),
      results: results,
      stamp: kstStamp()
    };
  }catch(e){
    const aborted = timedOut || (e && e.name === 'AbortError');
    return { ok: false, reason: aborted ? 'timeout' : 'network', message: String((e && e.message) || e || '').slice(0, 160) };
  }finally{
    if(timer) clearTimeout(timer);
  }
}

/* 검색 결과를 프롬프트용 텍스트로 만든다(요약 + 상위 결과 제목·URL·본문 일부). */
function tavilyContextBlock(search){
  const one = s => String(s || '').replace(/\s+/g, ' ').trim();
  const lines = ['[실시간 웹 검색 결과 · Tavily · ' + (search.stamp || kstStamp()) + ']'];
  if(search.answer) lines.push('검색 요약: ' + one(search.answer).slice(0, TAVILY_ANSWER_CHARS));
  const rs = (search.results || []).slice(0, TAVILY_MAX_RESULTS);
  if(rs.length){
    lines.push('상위 결과:');
    rs.forEach((r, i) => {
      lines.push((i + 1) + '. ' + (r.title || '제목 없음') + (r.url ? ' — ' + r.url : ''));
      if(r.content) lines.push('   ' + one(r.content).slice(0, TAVILY_SNIPPET_CHARS));
    });
  }
  return lines.join('\n');
}

/* 그록이 출처 줄을 빼먹으면 검색 결과 제목으로 직접 붙인다(최대 2개). */
function groqWithSources(text, search){
  const body = String(text || '').trim();
  if(!search || !search.ok) return body;
  if(/🔎\s*출처/.test(body)) return body;
  const titles = (search.results || []).map(r => r.title).filter(Boolean).slice(0, 2);
  if(!titles.length) return body;
  return body + '\n🔎 출처: ' + titles.join(' · ');
}

function buildGroqPrompt(msg, search){
  const list = visibleMessages();
  const i = list.findIndex(m => m.id === msg.id);
  const before = (i >= 0 ? list.slice(0, i) : list).filter(m => !m.sys).slice(-6);
  const line = m => (m.name || '무명') + ': ' + String(m.text || '').replace(/\s+/g, ' ').slice(0, 300);
  const ctx = before.length ? before.map(line).join('\n') : '(아직 없음)';
  let out = '[지금 시각]\n' + kstStamp() + '\n\n'
    + '[최근 무전 기록]\n' + ctx + '\n\n';
  if(search && search.ok) out += tavilyContextBlock(search) + '\n\n';
  return out + '[지금 온 무전]\n' + line(msg)
    + '\n\n위 무전에 그록으로서 답해라. 답변 본문만 써라.';
}

function groqSleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

/* 모델 하나를 호출합니다. 응답 지연은 AbortController로 끊습니다.
   opts.plain === true 이면 reasoning_effort 같은 모델별 파라미터를 빼고 보냅니다
   (파라미터를 모르는 모델이 400으로 거절할 때 대비). */
async function groqCallModel(model, promptText, key, timeoutMs, opts){
  const plain = !!(opts && opts.plain);
  const persona = (opts && opts.persona) || GROQ_PERSONA;
  const payload = {
    model: model.id,
    messages: [
      { role: 'system', content: persona },
      { role: 'user', content: promptText }
    ],
    temperature: 0.6,
    top_p: 0.95,
    max_completion_tokens: GROQ_MAX_TOKENS,
    stream: false
  };
  if(!plain){
    if(model.kind === 'gptoss'){
      payload.reasoning_effort = 'low';    /* 짧은 무전 답이라 추론은 가볍게 — 속도 우선 */
    }
    if(model.kind === 'qwen'){
      payload.reasoning_effort = 'none';   /* 추론 토큰 없이 바로 답 */
    }
  }

  let timer = null, ctrl = null, timedOut = false;
  if(typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    timer = setTimeout(() => { timedOut = true; try{ ctrl.abort(); }catch(e){} }, timeoutMs);
  }
  try{
    const opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(payload)
    };
    if(ctrl) opt.signal = ctrl.signal;
    const r = await fetch(GROQ_ENDPOINT, opt);
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    return { r, data, timedOut: timedOut };
  }catch(e){
    return { r: null, data: null, timedOut: timedOut || !!(e && e.name === 'AbortError'), netErr: e };
  }finally{
    if(timer) clearTimeout(timer);
  }
}

/* 답 본문을 꺼냅니다. 추론 모델이 본문 앞에 붙이는 <think>…</think> 류는 걷어냅니다. */
function groqText(data){
  const ch = ((data && data.choices) || [])[0] || {};
  const msg = ch.message || {};
  let out = String(msg.content == null ? '' : msg.content);
  out = out.replace(/<(think|thinking|reasoning)>[\s\S]*?<\/\1>/gi, '').trim();
  if(/^<(think|thinking|reasoning)>/i.test(out)) out = '';
  return out;
}

/* 429·404·5xx·응답 지연·빈 응답이면 다음 모델로 넘어가 계속 시도합니다.
   모든 모델이 막혔을 때만 사용자에게 한 번 안내합니다. */
async function groqFetch(promptText, key, opts){
  const callOpts = opts || {};
  const started = Date.now();
  const tried = [];
  const pushTried = id => { if(tried.indexOf(id) < 0) tried.push(id); };
  let lastModelErr = '';
  let sawBusy = false, sawQuota = false, sawTimeout = false, sawNetwork = false,
      sawNotFound = false, sawEmpty = false, sawPerm = false;

  for(let i = 0; i < GROQ_MODELS.length; i++){
    const model = GROQ_MODELS[i];
    if(GROQ_TOTAL_BUDGET_MS - (Date.now() - started) <= 500) break; /* 전체 예산 소진 */
    let useExtras = true;

    for(let pass = 0; pass < 2; pass++){
      const left = GROQ_TOTAL_BUDGET_MS - (Date.now() - started);
      if(left <= 500) break;
      const res = await groqCallModel(model, promptText, key, Math.min(GROQ_ATTEMPT_TIMEOUT_MS, left),
                                       { plain: !useExtras, persona: callOpts.persona });

      if(res.r && res.r.ok && res.data){
        const out = groqText(res.data);
        if(out) return { text: out, model: model.id, tried: tried };
        const why = (((res.data.choices || [])[0] || {}).finish_reason) || '';
        pushTried(model.id);
        sawEmpty = true;
        lastModelErr = '본문 없음' + (why ? '(' + why + ')' : '');
        break;
      }

      if(!res.r){
        pushTried(model.id);
        if(res.timedOut) sawTimeout = true; else sawNetwork = true;
        lastModelErr = res.timedOut ? '응답 지연(timeout)' : 'network: ' + String((res.netErr && res.netErr.message) || res.netErr || '');
        break;
      }

      const status = res.r.status;
      const err = (res.data && res.data.error) || {};
      const msg = String(err.message || err.code || err.type || '');
      lastModelErr = msg || ('HTTP ' + status);

      /* 키 문제 — 다른 모델로 넘어가도 어차피 같으니 바로 멈추고 설정을 안내 */
      if(status === 401 || (status === 400 && /invalid[ _]?api[ _]?key|api[ _]?key.*(invalid|expired)|unauthorized|authentication/i.test(msg))){
        throw { kind: 'key', userMessage: '⚡ 그록(Groq) API 키가 거부됐습니다(' + status + '). 인력 현황 → 🔑 그록(Groq) API 키 설정에서 키를 다시 넣어주세요.' };
      }

      /* reasoning_effort 같은 파라미터를 모르는 모델 → 같은 모델을 순수 본문으로 한 번 더 */
      if(status === 400 && useExtras && /reasoning|unsupported|unknown|unexpected|invalid[ _]?parameter|invalid[ _]?value/i.test(msg)){
        useExtras = false;
        continue;
      }

      /* 404(모델 없음·종료) · 429(한도) · 503(과부하) · 5xx(일시 장애) → 다음 모델로 */
      const retriable = GROQ_RETRY_STATUS.indexOf(status) >= 0
        || /rate[ _]?limit|too many requests|overloaded|unavailable|try again|decommission|does not exist|not[ _]?found|model[ _]?not|internal|temporar/i.test(msg);
      pushTried(model.id);
      if(status === 429) sawQuota = true;
      else if(status === 404) sawNotFound = true;
      else if(status === 403) sawPerm = true;
      else if(status >= 500) sawBusy = true;
      if(!retriable){
        throw { kind: 'api', userMessage: '⚡ 그록 호출이 실패했습니다(' + status + '). ' + msg.slice(0, 120) };
      }
      break;
    }

    if(i < GROQ_MODELS.length - 1) await groqSleep(GROQ_RETRY_DELAY_MS);
  }

  /* 모든 모델 소진 — 원인에 맞게 한 번만 알린다 */
  const detail = ' (시도: ' + (tried.join(' → ') || '-') + ')' + (lastModelErr ? ' · ' + String(lastModelErr).slice(0, 80) : '');
  if(sawQuota){
    throw { kind: 'quota', userMessage: '⏳ 그록 무료 호출 한도를 넘었습니다(429). 1분쯤 뒤에 다시 불러주세요.' + detail };
  }
  if(sawBusy){
    throw { kind: 'busy', userMessage: '⏳ 지금 그록 모델이 모두 붐빕니다. 1~2분 뒤에 다시 불러주세요.' + detail };
  }
  if(sawTimeout || sawNetwork){
    throw { kind: 'network', userMessage: '📡 그록 서버 응답이 늦거나 무전망(인터넷)이 불안정합니다. 잠시 뒤 다시 불러주세요.' + detail };
  }
  if(sawPerm){
    throw { kind: 'perm', userMessage: '🚫 이 키로는 그록 모델 호출이 거부됐습니다(403). console.groq.com 에서 키·모델 접근 상태를 확인해 주세요.' + detail };
  }
  if(sawNotFound){
    throw { kind: 'model', userMessage: '⚡ 쓸 수 있는 그록 모델을 찾지 못했습니다. Groq 콘솔에서 사용 가능한 모델을 확인해 주세요.' + detail };
  }
  if(sawEmpty){
    throw { kind: 'empty', userMessage: '⚡ 그록 답이 비어 있습니다. 질문을 조금 바꿔 다시 불러주세요.' + detail };
  }
  throw { kind: 'api', userMessage: '⚡ 그록 호출이 실패했습니다. 잠시 뒤 다시 불러주세요.' + detail };
}

function askGroq(msg){
  const key = groqKey();
  if(!key){
    S.groqNoKeyHint = true;
    render();
    toast('⚡ 그록 API 키가 없습니다 — [인력 현황]에서 넣어주세요');
    return Promise.resolve(null);
  }
  if(S.groqBusy){
    toast('⚡ 그록이 이전 무전에 답하는 중입니다');
    return Promise.resolve(null);
  }
  S.groqBusy = true;
  S.groqNoKeyHint = false;
  const base = S.agents.groq || Object.assign({}, SEED_AGENTS.groq);
  upsertAgent(Object.assign({}, base, { status: '작업중', zone: 'work' }));
  render();

  /* Tavily 키가 있고 잡담이 아니면 실시간 검색을 먼저 돌린다. 실패해도 그록은 그대로 부른다. */
  const tkey = tavilyKey();
  const question = groqQuestionText(msg);
  const wantLive = !!(tkey && !isGroqChitchat(question));
  const searchP = wantLive
    ? tavilySearch(question, tkey, { timeoutMs: S.tavilyTimeoutMs || TAVILY_TIMEOUT_MS })
        .catch(e => ({ ok: false, reason: 'error', message: String((e && e.message) || e || '') }))
    : Promise.resolve(null);

  return searchP
    .then(found => {
      const search = found && found.ok ? found : null;
      const searchFailed = wantLive && !search;
      if(searchFailed) toast('🔎 실시간 검색이 안 돼 그록 지식만으로 답합니다');
      const persona = groqPersonaText({ search: !!search, tried: searchFailed, tavilyReady: !!tkey });
      return groqFetch(buildGroqPrompt(msg, search), key, { persona: persona })
        .then(res => postAiMessage(search ? groqWithSources(res.text, search) : res.text,
          { from: 'groq', model: res.model, live: !!search, searchFailed: searchFailed || undefined }));
    })
    .catch(err => {
      if(err && err.kind === 'key') S.groqNoKeyHint = true;
      postAiMessage((err && err.userMessage) || '⚡ 그록 호출이 실패했습니다.', { from: 'groq', error: true });
      return null;
    })
    .then(m => {
      S.groqBusy = false;
      const back = Object.assign({}, S.agents.groq || base, { status: '대기중', zone: (base.zone || 'office') });
      upsertAgent(back);
      render();
      return m;
    });
}

let booted = false;
function onSignedIn(user){
  AUTH.user = user; AUTH.denied = '';
  if(AUTH.required && S.me && S.me.id === 'jingyu' && !canChooseJingyu()){
    S.me = null;
    LS.del('me');
  }
  hideAuthGate();
  if(!booted){ afterAuth(); }
  else {
    render();
    Wire.pull().then(()=> Wire.restartStream()).catch(()=>{});
  }
}
/* 로그인 후(또는 인증이 필요 없는 모드에서) 무전망을 켭니다. 한 번만 실행됩니다. */
function afterAuth(){
  if(booted) return;
  booted = true;
  render();
  if(!S.me) openIdentity(true);

  Wire.start().then(()=>{
    /* 새 참가자 알림 + 상태 공유 */
    if(Object.keys(S.agents).length) announceState();
    Wire.push({ t:'hello', ts: now(), d:{} }).catch(()=>{});
    setTimeout(announceState, 1200);
    if(isOwner()) loadAllowedEmails();
  }).catch(()=>{});

  /* 다른 탭/기기 상태 최신화 */
  setInterval(()=>{ if(Wire.mode === 'rtdb' && S.conn !== 'live') Wire.pull().catch(()=>{}); }, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Wire.pull().catch(()=>{}); });
  window.addEventListener('beforeunload', writeState);

  /* 로그인 토큰은 1시간 유효 — 20분마다 새로 받아 실시간 스트림을 다시 연결합니다. */
  if(AUTH.required){
    setInterval(async ()=>{
      if(!AUTH.user || AUTH.denied) return;
      await Wire.ensureToken(true);
      Wire.restartStream();
    }, 20 * 60 * 1000);
  }
}

(function boot(){
  /* 저장된 상태 복원 */
  const cached = LS.get('state', null);
  loadNameMemo();
  if(cached && cached.agents) replaceAgents(cached.agents);
  if(cached && cached.tasks) replaceTasks(cached.tasks);
  const cachedMsgs = LS.get('msgs', null);
  if(cachedMsgs && Array.isArray(cachedMsgs.list)) cachedMsgs.list.forEach(m => { if(m && m.id && !S.messages[m.id]) S.messages[m.id] = m; });
  S.me = LS.get('me', null);
  S.lastSeen = LS.get('lastSeen', 0);
  S._bootAt = now();

  /* 씨앗 데이터 — 시각을 아주 오래전(1)으로 두어, 서버에 저장된 이름·상태가 항상 이긴다. */
  if(Object.keys(S.agents).length === 0){
    for(const k in SEED_AGENTS) S.agents[k] = applyNameMemo(Object.assign({}, SEED_AGENTS[k], { updatedAt: 1 }));
  }
  /* 저장된 명단(localStorage)에 남아 있는 퇴역 인력(Cue 등)은 빼고 시작합니다. */
  RETIRED_AGENTS.forEach(id => { delete S.agents[id]; });
  Object.values(S.agents).forEach(rememberName);
  if(!S.messages[WELCOME.id]) S.messages[WELCOME.id] = Object.assign({}, WELCOME, { ts: now() - 120000 });
  ensureCoreAgents();

  render();

  /* 보안 규칙(2026-11-27~): RTDB 모드에서는 Google 로그인 후에만 무선망을 연결합니다. */
  if(AUTH.required){
    showAuthGate();
    if(authAvailable()){
      try{ if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CFG); }catch(e){}
      try{
        firebase.auth().onAuthStateChanged(async user => {
          if(!user){
            AUTH.user = null; AUTH.token = ''; AUTH.tokenAt = 0;
            showAuthGate(); render(); return;
          }
          try{ AUTH.token = await user.getIdToken(); AUTH.tokenAt = now(); }catch(e){ AUTH.token = ''; }
          onSignedIn(user);
        });
        firebase.auth().getRedirectResult().catch(()=>{});
      }catch(e){ AUTH.error = 'sdk'; showAuthGate(); }
    }
    return;
  }
  afterAuth();
})();
</script>
</body>
</html>
